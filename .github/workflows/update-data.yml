name: Refresh cuisines from Wikipedia

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays, early morning Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/overrides.json"
      - "content/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

# One rebuild at a time; a newer push waits for the one running
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PyYAML (notes) and d3-force (graph layout)
        run: |
          pip install pyyaml
          npm ci
      - name: Rebuild the cuisine index
        run: ./scripts/update.sh
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/; then
            echo "No changes from Wikipedia this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Refresh cuisines from Wikipedia"
          # Someone may have pushed while this ran. The data is generated, so on a
          # clash keep this run's copy (it was built from the newest content).
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
