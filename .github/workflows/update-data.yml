name: Refresh cuisines from Wikipedia

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays, early morning Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/overrides.json"
      - "content/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the cuisine index
        run: ./scripts/update.sh
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/; then
            echo "No changes from Wikipedia this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Refresh cuisines from Wikipedia"
          git push
