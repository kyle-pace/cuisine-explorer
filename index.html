<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuisine Explorer</title>
<meta name="description" content="Spin the globe and explore the world's cuisines, with Wikipedia as the guide and recipe sites and cookbooks for each.">
<meta property="og:title" content="Cuisine Explorer">
<meta property="og:description" content="Explore the world's cuisines on a globe, with recipe sites and cookbooks for each.">
<meta property="og:image" content="https://kylepace.net/labs/cuisines/share.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1b1424">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1b1424;      /* aubergine: ocean and page */
    --panel: #241b2f;
    --panel-2: #2e2439;
    --line: #4a3f57;
    --rice: #ede6da;       /* text */
    --muted: #a99fb5;
    --saffron: #f0b340;    /* Asia */
    --beet: #cf5f87;       /* Europe */
    --chili: #e46a3f;      /* Africa */
    --tomatillo: #94bd5c;  /* Americas */
    --seaglass: #55b8ad;   /* Oceania */
    /* Atkinson Hyperlegible Next, as on kylepace.net */
    --font: "Atkinson Hyperlegible Next", system-ui, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--night); color: var(--rice); font-family: var(--font); font-size: 16px; line-height: 1.5; }
  body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; border-radius: 4px; }

  #globe { position: fixed; inset: 0; touch-action: none; }
  #globe canvas { display: block; }

  /* Top-left: title and search */
  .masthead { position: fixed; top: 24px; left: 28px; width: min(380px, calc(100vw - 56px)); z-index: 5; }
  .masthead h1 { font-weight: 800; font-size: 2.5rem; line-height: 1; margin: 0 0 10px; letter-spacing: -0.02em; }
  .masthead p { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; max-width: 34ch; }
  .search { position: relative; }
  .search input {
    width: 100%; padding: 11px 14px 11px 40px; border-radius: 22px; border: 1px solid var(--line);
    background: rgba(36, 27, 47, 0.9); color: var(--rice); font: inherit; backdrop-filter: blur(6px);
    -webkit-appearance: none; appearance: none;
  }
  .search input::placeholder { color: var(--muted); }
  .search svg { position: absolute; left: 15px; top: 13px; width: 16px; height: 16px; stroke: var(--muted); z-index: 1; pointer-events: none; }
  .results { list-style: none; margin: 6px 0 0; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; max-height: 50vh; overflow: auto; display: none; }
  .results.open { display: block; }
  .results li { padding: 9px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  .results li small { color: var(--muted); white-space: nowrap; }
  .results li[aria-selected="true"], .results li:hover { background: var(--panel-2); }

  /* Bottom-left: legend, layer toggles, hint */
  .legend { position: fixed; left: 28px; bottom: 24px; z-index: 5; font-size: 0.85rem; color: var(--muted); }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 12px; max-width: 360px; }
  .swatches span { display: inline-flex; align-items: center; gap: 6px; }
  .swatches i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .toggles { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-btn { border: 1px solid var(--line); background: rgba(36, 27, 47, 0.88); border-radius: 18px; padding: 7px 13px; cursor: pointer; font-size: 0.85rem; }
  .chip-btn[aria-pressed="true"] { background: var(--rice); color: var(--night); border-color: var(--rice); }
  .hint { margin: 10px 0 0; max-width: 36ch; }

  /* Region name labels on the globe */
  .pin {
    display: block; transform: translate(-50%, -50%); white-space: nowrap; cursor: pointer; pointer-events: auto;
    font: 600 0.78rem/1 var(--font); color: var(--night); background: rgba(237, 230, 218, 0.92);
    border: 0; border-radius: 999px; padding: 6px 10px; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
  }
  .pin:hover, .pin.on { background: #fff; z-index: 2; }
  .pin.on { outline: 2px solid var(--accent, var(--saffron)); outline-offset: 1px; }
  .pin[hidden] { display: none; }

  /* The cuisine card: a side panel on wide screens, a bottom sheet on phones */
  .panel {
    position: fixed; top: 16px; right: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px)); z-index: 6;
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    transform: translateX(calc(100% + 24px));
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel.open { transform: none; }
  .handle { display: none; }
  .panel-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 12px 0 24px; gap: 8px; }
  .crumbs { font-size: 0.82rem; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumbs button { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .close { flex: none; background: none; border: 0; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; line-height: 1; color: var(--muted); }
  .close:hover { background: var(--panel-2); color: var(--rice); }
  .panel-body { overflow-y: auto; padding: 4px 24px 28px; overscroll-behavior: contain; }
  .panel h2 { font-weight: 800; letter-spacing: -0.02em; font-size: 2rem; line-height: 1.1; margin: 4px 0 6px; }
  .kind { color: var(--muted); font-size: 0.92rem; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .kind i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .intro { font-size: 1rem; max-width: 62ch; }
  .intro p { margin: 0 0 8px; }
  .more { background: none; border: 0; padding: 0; color: var(--muted); font-size: 0.88rem; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .wiki-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; margin: 16px 0 6px;
    padding: 14px 18px; border-radius: 14px; background: var(--rice); color: var(--night);
    font-size: 1.02rem; font-weight: 700; text-decoration: none; text-align: center;
  }
  .wiki-btn:hover { background: #fff8ec; }
  .wiki-btn svg, .site svg { width: 18px; height: 18px; flex: none; }
  .source { font-size: 0.78rem; color: var(--muted); margin: 0; text-align: center; }
  .panel h3 { font-weight: 700; font-size: 1.15rem; margin: 26px 0 10px; }
  .empty { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .link { background: none; border: 0; padding: 0; color: var(--rice); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: inherit; }

  /* Recipe sites: the main thing to do next, so they're big tappable cards */
  .sites { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .site {
    display: flex; align-items: center; gap: 12px; text-decoration: none; padding: 12px 14px;
    background: var(--panel-2); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 12px;
  }
  .site:hover { border-color: var(--accent); }
  .site div { flex: 1; min-width: 0; }
  .site strong { display: block; font-size: 1rem; }
  .site small { display: block; color: var(--muted); font-size: 0.85rem; line-height: 1.35; margin-top: 2px; }
  .site .host { color: var(--rice); opacity: 0.75; }
  .tag { display: inline-block; font-size: 0.72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; margin-left: 6px; vertical-align: 2px; font-weight: 400; }
  .site svg { color: var(--muted); }

  /* Cookbooks: one row that scrolls sideways */
  .books { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; margin: 0 -24px; padding-left: 24px; padding-right: 24px; scrollbar-width: thin; }
  .book { flex: 0 0 112px; text-decoration: none; scroll-snap-align: start; }
  .cover { aspect-ratio: 2 / 3; border-radius: 3px 6px 6px 3px; overflow: hidden; position: relative; background: color-mix(in srgb, var(--accent, #4a3f57) 38%, var(--panel-2)); box-shadow: inset 6px 0 0 rgba(0,0,0,0.18); display: flex; align-items: flex-end; padding: 10px 8px 10px 14px; font-weight: 700; font-size: 0.85rem; line-height: 1.15; }
  .cover span { position: relative; text-shadow: 0 1px 2px rgba(0,0,0,0.4); }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .book .meta { font-size: 0.78rem; color: var(--muted); margin-top: 6px; line-height: 1.3; }
  .book .meta b { color: var(--rice); font-weight: 600; display: block; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--line); background: none; border-radius: 16px; padding: 6px 12px; cursor: pointer; font-size: 0.9rem; text-align: left; }
  .chip:hover { background: var(--panel-2); }
  .connections { list-style: none; margin: 0; padding: 0; }
  .connections li { margin: 0 0 8px; }
  .connections button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-size: 0.95rem; }
  .connections button:hover span:first-child { text-decoration: underline; }
  .connections span + span { color: var(--muted); }

  .tooltip { font-family: var(--font); background: var(--panel); border: 1px solid var(--line); color: var(--rice); padding: 6px 10px; border-radius: 8px; font-size: 0.85rem; }
  .tooltip small { color: var(--muted); display: block; }

  .loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); z-index: 1; }

  @media (prefers-reduced-motion: no-preference) {
    .panel { transition: transform 0.26s var(--ease); }
    .panel.dragging { transition: none; }
  }

  /* Phones: compact controls, and the card becomes a bottom sheet that peeks
     over the map and expands when tapped or dragged up */
  @media (max-width: 720px) {
    .masthead { top: 12px; left: 12px; width: calc(100vw - 24px); }
    .masthead h1 { font-size: 1.6rem; margin-bottom: 8px; }
    .masthead p, .swatches, .hint { display: none; }
    .legend { left: 12px; right: 12px; bottom: calc(12px + var(--safe-b)); }
    .toggles { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .chip-btn { white-space: nowrap; padding: 9px 14px; }
    .sheet-open .legend { visibility: hidden; }
    .pin { font-size: 0.85rem; padding: 8px 12px; }

    .panel {
      top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 88dvh; border-radius: 20px 20px 0 0;
      border-bottom: 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.4);
      transform: translateY(100%);
    }
    .panel.open { transform: translateY(calc(100% - var(--peek, 44dvh))); }
    .panel.open.full { transform: translateY(0); }
    .handle {
      display: block; flex: none; width: 100%; height: 26px; border: 0; background: none; cursor: grab; touch-action: none;
      position: relative;
    }
    .handle::before { content: ""; position: absolute; left: 50%; top: 10px; width: 40px; height: 5px; margin-left: -20px; border-radius: 3px; background: var(--line); }
    .panel-top { padding: 0 8px 0 20px; touch-action: none; }
    .panel-body { padding: 0 20px calc(28px + var(--safe-b)); }
    .panel:not(.full) .panel-body { overflow: hidden; }
    .panel h2 { font-size: 1.7rem; }
    .books { margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
  }

  /* Embedded in a page that already has its own title (kylepace.net/labs/cuisines/) */
  .embed .masthead h1, .embed .masthead p { display: none; }
  .embed .masthead { top: 16px; left: 16px; }
  .embed .legend { left: 16px; bottom: 16px; }
</style>
</head>
<body>
<div id="globe" aria-hidden="true"></div>
<div class="loading" id="loading">Setting the table…</div>

<header class="masthead">
  <h1>Cuisine Explorer</h1>
  <p>Spin the globe, pick a place, and see what's cooking there. Every cuisine links back to Wikipedia.</p>
  <div class="search" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search 600+ cuisines" autocomplete="off" enterkeyhint="go"
           aria-label="Search cuisines" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
    <ul class="results" id="results" role="listbox" aria-label="Matching cuisines"></ul>
  </div>
</header>

<div class="legend">
  <div class="swatches" aria-hidden="true">
    <span><i style="background:var(--chili)"></i>Africa</span>
    <span><i style="background:var(--tomatillo)"></i>Americas</span>
    <span><i style="background:var(--saffron)"></i>Asia</span>
    <span><i style="background:var(--beet)"></i>Europe</span>
    <span><i style="background:var(--seaglass)"></i>Oceania</span>
  </div>
  <div class="toggles">
    <button class="chip-btn" id="t-arcs" aria-pressed="true">Diaspora routes</button>
    <button class="chip-btn" id="t-beyond" aria-pressed="false">Beyond borders</button>
  </div>
  <p class="hint">Pick a country, or zoom in, to see its regional cuisines.</p>
</div>

<aside class="panel" id="panel" aria-label="Cuisine details" tabindex="-1">
  <button class="handle" id="handle" aria-label="Expand or collapse the card"></button>
  <div class="panel-top" id="panel-top">
    <div class="crumbs" id="crumbs"></div>
    <button class="close" id="close" aria-label="Close">×</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
<!--INLINE_DATA-->
<script>
(async function () {
  const embedded = new URLSearchParams(location.search).has("embed");
  if (embedded) document.documentElement.classList.add("embed");
  // When embedded on the same site, keep the parent page's address in step so links can be shared
  const setHash = h => {
    history.replaceState(null, "", h ? "#" + h : location.pathname + location.search);
    if (embedded) try { parent.history.replaceState(null, "", h ? "#" + h : parent.location.pathname); } catch (e) {}
  };
  const COLORS = {
    "African cuisine": "#e46a3f",
    "Cuisine of the Americas": "#94bd5c",
    "Asian cuisine": "#f0b340",
    "European cuisine": "#cf5f87",
    "Oceanic cuisine": "#55b8ad",
  };
  const CONTINENT = {
    "African cuisine": "Africa", "Cuisine of the Americas": "The Americas",
    "Asian cuisine": "Asia", "European cuisine": "Europe", "Oceanic cuisine": "Oceania",
  };
  const NEUTRAL = "#a99fb5";
  const KIND_LABEL = {
    national: "National cuisine", regional: "Regional cuisine", diaspora: "Diaspora cuisine",
    peoples: "Cuisine of a people", religious: "Religious cuisine or diet",
    historical: "Historical cuisine", style: "Style of cooking",
  };
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const isPhone = () => innerWidth <= 720;

  // Data: inlined in the preview build, fetched alongside the page otherwise
  async function load(id, path) {
    const el = document.getElementById(id);
    if (el) return JSON.parse(el.textContent);
    const r = await fetch(path);
    if (!r.ok) throw new Error(path);
    return r.json();
  }
  const [data, countries, picksFile, suggestionsFile, regionsFile] = await Promise.all([
    load("data-cuisines", "data/cuisines.json"),
    load("data-countries", "data/countries.geojson"),
    load("data-picks", "data/picks.json").catch(() => ({})),
    load("data-suggestions", "data/suggestions.json").catch(() => ({})),
    load("data-regions", "data/regions.geojson").catch(() => ({ features: [] })),
  ]);
  const suggestions = suggestionsFile.cuisines || {};
  const picks = picksFile.cuisines || {};
  // Full Wikipedia intros, built weekly; loaded in the background
  let summaries = {};
  load("data-summaries", "data/summaries.json").then(d => { summaries = d || {}; if (selected) fillIntro(selected); }).catch(() => {});

  const all = data.cuisines;
  const byId = new Map(all.map(c => [c.id, c]));
  const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const bySlug = new Map(all.map(c => [slug(c.id), c]));
  const nationalByIso = new Map(all.filter(c => c.kind === "national").map(c => [c.iso3, c]));
  const colorOf = c => COLORS[(c.region || [])[0]] || (c.iso3 && nationalByIso.get(c.iso3) && COLORS[(nationalByIso.get(c.iso3).region || [])[0]]) || NEUTRAL;
  const inCountry = iso => all.filter(c => c.iso3 === iso && c.kind !== "national");
  const featIso = f => {
    const p = f.properties;
    if (p.ids) return p.iso;
    for (const code of [p.ISO_A3_EH, p.ADM0_A3]) if (nationalByIso.has(code)) return code;
    return p.ISO_A3_EH !== "-99" ? p.ISO_A3_EH : p.ADM0_A3;
  };
  const land = countries.features.filter(f => f.properties.ADM0_A3 !== "ATA");
  const isoName = new Map(land.map(f => [featIso(f), f.properties.NAME]));

  // --- Geometry helpers -------------------------------------------------------
  const ringsOf = g => g.type === "Polygon" ? [g.coordinates] : g.coordinates;
  function inRing(x, y, ring) {
    let inside = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  const contains = (f, lng, lat) => ringsOf(f.geometry).some(poly => inRing(lng, lat, poly[0]) && !poly.slice(1).some(h => inRing(lng, lat, h)));
  function boxOf(g) {
    let a = 180, b = 90, c = -180, d = -90;
    for (const poly of ringsOf(g)) for (const [x, y] of poly[0]) { a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); d = Math.max(d, y); }
    return [a, b, c, d];
  }
  // A point inside the largest piece of a shape, for its label
  function labelPoint(g) {
    let best = null, area = -1;
    for (const poly of ringsOf(g)) {
      const r = poly[0]; let s = 0, cx = 0, cy = 0;
      for (let i = 0; i < r.length - 1; i++) { const k = r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1]; s += k; cx += (r[i][0] + r[i + 1][0]) * k; cy += (r[i][1] + r[i + 1][1]) * k; }
      if (Math.abs(s) > area) { area = Math.abs(s); best = s ? [cy / (3 * s), cx / (3 * s)] : [r[0][1], r[0][0]]; }
    }
    return best;
  }

  // --- Regions: the provinces or states a regional cuisine comes from --------
  const regionOf = new Map();   // cuisine id -> region feature
  const regions = [];
  for (const f of regionsFile.features || []) {
    const ids = f.properties.ids.filter(id => byId.has(id));
    if (!ids.length) continue;
    const first = byId.get(ids[0]);
    const box = boxOf(f.geometry);
    f.properties = { ids, iso: first.iso3, size: Math.max(box[2] - box[0], box[3] - box[1]), at: labelPoint(f.geometry) };
    regions.push(f);
    ids.forEach(id => regionOf.set(id, f));
  }
  // Where each cuisine sits: its own point, else the middle of its region
  const placeOf = c => c.loc || regionOf.get(c.id)?.properties.at || null;

  // Arcs: diaspora (origin country -> host country) and influence (parent -> regional)
  const arcs = [];
  for (const c of all) {
    if (c.arc) {
      const a = nationalByIso.get(c.arc.from), b = nationalByIso.get(c.arc.to);
      if (a && b && a.loc && b.loc) arcs.push({ c, from: a, to: b, start: a.loc, end: b.loc });
    }
    for (const p of c.links || []) {
      const pc = byId.get(p);
      if (pc && pc.loc && placeOf(c)) arcs.push({ c, from: pc, to: c, start: pc.loc, end: placeOf(c) });
    }
  }
  const beyond = all.filter(c => ["religious", "historical", "style", "peoples"].includes(c.kind) || (c.kind === "diaspora" && !c.arc));

  // Regional cuisines that can be shown for a country: shapes plus name labels
  const local = new Map();
  for (const c of all) {
    if (c.kind === "national" || !c.iso3 || !placeOf(c) || ["religious", "style", "historical"].includes(c.kind)) continue;
    if (c.kind === "diaspora" && c.arc) continue;
    if (!local.has(c.iso3)) local.set(c.iso3, []);
    local.get(c.iso3).push(c);
  }
  const shelfSize = c => ((picks[c.id]?.sites || []).length + (picks[c.id]?.cookbooks || []).length) * 2 +
    (suggestions[c.id]?.sites || []).length + (suggestions[c.id]?.cookbooks || []).length;

  // --- Globe ------------------------------------------------------------------
  const el = document.getElementById("globe");
  let hoverIso = null, hoverRegion = null, selected = null, focus = new Set();
  const featColor = f => { const n = nationalByIso.get(featIso(f)); return n ? (COLORS[(n.region || [])[0]] || NEUTRAL) : null; };
  const mix = (hex, amt) => {
    const a = parseInt(hex.slice(1), 16), b = 0x1b1424;
    const ch = s => Math.round(((a >> s) & 255) * amt + ((b >> s) & 255) * (1 - amt));
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
  };
  const selIso = () => selected ? selected.iso3 : null;
  const related = a => !!selected && (selected === a.c || selected === a.from || selected === a.to ||
    (selected.kind === "national" && (a.from.iso3 === selected.iso3 || a.to.iso3 === selected.iso3)));
  const isRegion = f => !!f.properties.ids;
  const regionSelected = f => selected && f.properties.ids.includes(selected.id);

  const world = Globe({ animateIn: !reduceMotion })(el)
    .backgroundColor("#1b1424")
    .showAtmosphere(true).atmosphereColor("#6f5690").atmosphereAltitude(0.12)
    .polygonsData(land)
    .polygonAltitude(f => {
      if (isRegion(f)) return (regionSelected(f) ? 0.03 : f === hoverRegion ? 0.026 : 0.02) + Math.max(0, 0.008 - f.properties.size / 2000);
      const iso = featIso(f);
      return iso === selIso() ? 0.012 : iso === hoverIso ? 0.01 : 0.006;
    })
    .polygonCapColor(f => {
      if (isRegion(f)) {
        const c = colorOf(byId.get(f.properties.ids[0]));
        if (regionSelected(f)) return "#fff3dc";
        return f === hoverRegion ? mix(c, 1) : c + "99";
      }
      const c = featColor(f), iso = featIso(f);
      if (!c) return iso === hoverIso ? "#463b52" : "#3a3045";
      if (iso === selIso()) return selected.kind !== "national" ? mix(c, 0.7) : c;
      return mix(c, iso === hoverIso ? 0.85 : 0.6);
    })
    .polygonSideColor(f => isRegion(f) ? "rgba(237,230,218,0.25)" : (featColor(f) && featIso(f) === selIso() ? mix(featColor(f), 0.5) : "rgba(27,20,36,0.9)"))
    .polygonStrokeColor(f => isRegion(f) ? "rgba(255,248,236,0.85)" : "#1b1424")
    .polygonsTransitionDuration(reduceMotion ? 0 : 250)
    .polygonLabel(f => {
      if (isRegion(f)) {
        const names = f.properties.ids.map(id => byId.get(id).name);
        return `<div class="tooltip">${esc(names[0])}${names.length > 1 ? `<small>Also ${esc(names.slice(1).join(", "))}</small>` : "<small>Regional cuisine</small>"}</div>`;
      }
      const n = nationalByIso.get(featIso(f));
      const more = n ? (local.get(n.iso3) || []).length : 0;
      return `<div class="tooltip">${esc(n ? n.name : f.properties.NAME)}${n && more ? `<small>${more} regional ${more === 1 ? "cuisine" : "cuisines"} inside</small>` : n ? "" : "<small>Not on Wikipedia's list yet</small>"}</div>`;
    })
    .onPolygonHover(f => {
      hoverIso = f && !isRegion(f) ? featIso(f) : null;
      hoverRegion = f && isRegion(f) ? f : null;
      world.polygonAltitude(world.polygonAltitude()).polygonCapColor(world.polygonCapColor());
      el.style.cursor = f && (isRegion(f) || nationalByIso.get(featIso(f))) ? "pointer" : "grab";
    })
    .onPolygonClick(f => {
      if (isRegion(f)) return open(byId.get(f.properties.ids[0]));
      const n = nationalByIso.get(featIso(f));
      if (n) open(n);
    })
    // Name labels for the focused country's regional cuisines: big, easy targets
    .htmlElementsData([])
    .htmlLat(c => placeOf(c)[0]).htmlLng(c => placeOf(c)[1]).htmlAltitude(0.035)
    .htmlElement(c => {
      const b = document.createElement("button");
      b.className = "pin"; b.type = "button"; b.textContent = c.name.replace(/^Cuisine of (the )?/i, "").replace(/ (cuisine|food|diet)$/i, "");
      b.title = c.name; b.dataset.id = c.id;
      b.addEventListener("click", e => { e.stopPropagation(); open(c); });
      return b;
    })
    // Routes: faint threads until a country or cuisine is selected
    .arcsData(arcs)
    .arcStartLat(a => a.start[0]).arcStartLng(a => a.start[1])
    .arcEndLat(a => a.end[0]).arcEndLng(a => a.end[1])
    .arcColor(a => {
      if (related(a)) return [colorOf(a.from), colorOf(a.to)];
      const alpha = selected ? "14" : "40";
      return [colorOf(a.from) + alpha, colorOf(a.to) + alpha];
    })
    .arcStroke(a => related(a) ? 0.55 : 0.22)
    .arcAltitudeAutoScale(0.4)
    .arcDashLength(a => related(a) ? 0.35 : 1).arcDashGap(a => related(a) ? 0.15 : 0)
    .arcDashInitialGap(() => Math.random())
    .arcDashAnimateTime(a => related(a) && !reduceMotion ? 2600 : 0)
    .arcLabel(a => `<div class="tooltip">${esc(a.c.name)}<small>${esc(a.from.name.replace(/ cuisine$/, ""))} to ${esc(isoName.get(a.to.iso3) || a.to.name)}</small></div>`)
    .onArcClick(a => open(a.c));

  // Labels on the far side of the globe are hidden; the rest are decluttered
  const hasVis = typeof world.htmlElementVisibilityModifier === "function";
  if (hasVis) world.htmlElementVisibilityModifier((elm, visible) => {
    const v = visible ? "1" : "";
    if (elm.dataset.front !== v) { elm.dataset.front = v; if (!visible) elm.hidden = true; scheduleDeclutter(); }
  });
  let dq = false;
  function scheduleDeclutter() { if (!dq) { dq = true; requestAnimationFrame(() => { dq = false; declutter(); }); } }

  world.globeMaterial().color.set("#231a2e");
  world.globeMaterial().shininess = 2;
  const controls = world.controls();
  controls.autoRotate = !reduceMotion;
  controls.autoRotateSpeed = 0.35;
  controls.enableDamping = true;
  const stopSpin = () => { controls.autoRotate = false; };
  el.addEventListener("pointerdown", stopSpin);
  el.addEventListener("wheel", stopSpin, { passive: true });
  world.pointOfView({ lat: 22, lng: 20, altitude: isPhone() ? 2.8 : 2.1 }, 0);
  const resize = () => world.width(innerWidth).height(innerHeight);
  addEventListener("resize", resize); resize();
  document.getElementById("loading").remove();

  // --- Focus: which country's regions are showing -----------------------------
  // The selected cuisine's country, or, when nothing is selected, whatever country
  // is in the middle of the view once you've zoomed in.
  function setFocus(isos) {
    const next = new Set((isos || []).filter(Boolean));
    if (next.size === focus.size && [...next].every(i => focus.has(i))) return;
    focus = next;
    world.polygonsData(focus.size ? land.concat(regions.filter(r => focus.has(r.properties.iso))) : land);
    world.htmlElementsData([...focus].flatMap(iso => local.get(iso) || []));
    scheduleDeclutter();
  }
  // Countries near the middle of the view that have regional cuisines to show:
  // the one underneath first, then up to two of the nearest
  function countriesNear(lat, lng, alt) {
    const under = land.find(f => contains(f, lng, lat));
    const d = loc => Math.hypot(lat - loc[0], (lng - loc[1]) * Math.cos(lat * Math.PI / 180));
    const near = [...nationalByIso].filter(([iso, n]) => n.loc && local.has(iso) && d(n.loc) < 16 * alt)
      .sort((a, b) => d(a[1].loc) - d(b[1].loc)).map(([iso]) => iso);
    const first = under && local.has(featIso(under)) ? [featIso(under)] : [];
    return [...new Set(first.concat(near))].slice(0, 3);
  }
  // Hide labels that would overlap a more important one (more recipes, bigger region first)
  function declutter() {
    const pins = [...el.querySelectorAll(".pin")];
    if (!pins.length) return;
    const ranked = pins.map(p => {
      const c = byId.get(p.dataset.id);
      return { p, c, score: (c === selected ? 1e6 : 0) + shelfSize(c) * 10 + (regionOf.has(c.id) ? 50 : 0) - c.name.length };
    }).sort((a, b) => b.score - a.score);
    // Don't put labels under the search box, the controls or the card
    const kept = [".masthead", ".legend", ".panel.open"].map(sel => document.querySelector(sel))
      .filter(Boolean).map(n => { const r = n.getBoundingClientRect(); return [r.left - 6, r.top - 6, r.right + 6, r.bottom + 6]; });
    for (const { p } of ranked) {
      p.hidden = false;
      if (hasVis && !p.dataset.front) { p.hidden = true; continue; }
      const r = p.getBoundingClientRect();
      const box = [r.left - 4, r.top - 3, r.right + 4, r.bottom + 3];
      if (r.width === 0 || kept.some(k => box[0] < k[2] && box[2] > k[0] && box[1] < k[3] && box[3] > k[1])) { p.hidden = true; continue; }
      kept.push(box);
    }
    pins.forEach(p => p.classList.toggle("on", !!selected && p.dataset.id === selected.id));
  }
  let settle = null;
  controls.addEventListener("change", () => {
    scheduleDeclutter();
    clearTimeout(settle);
    settle = setTimeout(() => {
      if (selected && selected.iso3) return;
      const pov = world.pointOfView();
      setFocus(pov.altitude < 1.5 ? countriesNear(pov.lat, pov.lng, pov.altitude) : []);
    }, 180);
  });

  // --- Layer toggles ------------------------------------------------------------
  const arcsBtn = document.getElementById("t-arcs");
  arcsBtn.addEventListener("click", () => {
    const v = arcsBtn.getAttribute("aria-pressed") !== "true";
    arcsBtn.setAttribute("aria-pressed", String(v));
    world.arcsData(v ? arcs : []);
  });
  const beyondBtn = document.getElementById("t-beyond");
  beyondBtn.addEventListener("click", () => {
    const v = beyondBtn.getAttribute("aria-pressed") !== "true";
    if (v) showBeyond(); else closePanel();
  });

  // --- Panel / sheet ------------------------------------------------------------
  const panel = document.getElementById("panel");
  const body = document.getElementById("panel-body");
  const crumbs = document.getElementById("crumbs");
  document.getElementById("close").addEventListener("click", closePanel);
  addEventListener("keydown", e => { if (e.key === "Escape" && panel.classList.contains("open")) closePanel(); });

  function showPanel() {
    panel.classList.add("open");
    panel.classList.remove("full");
    document.body.classList.add("sheet-open");
    body.scrollTop = 0;
  }
  function closePanel() {
    panel.classList.remove("open", "full");
    document.body.classList.remove("sheet-open");
    beyondBtn.setAttribute("aria-pressed", "false");
    selected = null;
    refresh();
    if (location.hash) setHash("");
    const pov = world.pointOfView();
    setFocus(pov.altitude < 1.5 ? countriesNear(pov.lat, pov.lng, pov.altitude) : []);
  }
  function refresh() {
    world.polygonAltitude(world.polygonAltitude())
      .polygonCapColor(world.polygonCapColor())
      .polygonSideColor(world.polygonSideColor())
      .arcColor(world.arcColor()).arcStroke(world.arcStroke())
      .arcDashLength(world.arcDashLength()).arcDashGap(world.arcDashGap())
      .arcDashAnimateTime(world.arcDashAnimateTime());
    scheduleDeclutter();
  }

  // Phones: drag the handle (or the card's top) to expand, collapse, or dismiss.
  // Tapping the peeking card expands it.
  (function sheetGestures() {
    const grips = [document.getElementById("handle"), document.getElementById("panel-top")];
    let startY = 0, startT = 0, dragging = false, moved = false;
    grips.forEach(g => {
      g.addEventListener("pointerdown", e => {
        if (!isPhone() || e.target.closest(".close, .crumbs button")) return;
        dragging = true; moved = false; startY = e.clientY;
        const t = getComputedStyle(panel).transform;
        startT = t && t !== "none" ? new DOMMatrix(t).m42 : 0;
        panel.classList.add("dragging");
        g.setPointerCapture(e.pointerId);
      });
      g.addEventListener("pointermove", e => {
        if (!dragging) return;
        const dy = e.clientY - startY;
        if (Math.abs(dy) > 4) moved = true;
        panel.style.transform = `translateY(${Math.max(0, startT + dy)}px)`;
      });
      const end = e => {
        if (!dragging) return;
        dragging = false;
        panel.classList.remove("dragging");
        panel.style.transform = "";
        const dy = e.clientY - startY;
        if (!moved) { panel.classList.toggle("full"); return; }
        const full = panel.classList.contains("full");
        if (dy < -40) panel.classList.add("full");
        else if (dy > 40 && full) panel.classList.remove("full");
        else if (dy > 60 && !full) closePanel();
      };
      g.addEventListener("pointerup", end);
      g.addEventListener("pointercancel", end);
    });
    // A tap on the peeking card (not on a link or button) opens it fully
    body.addEventListener("click", e => {
      if (isPhone() && !panel.classList.contains("full") && !e.target.closest("a, button")) panel.classList.add("full");
    });
  })();

  // --- Summaries: short and clean, with the rest a tap away ---------------------
  const liveCache = new Map();
  function liveIntro(c) {
    if (!liveCache.has(c.id)) {
      const q = new URLSearchParams({ action: "query", prop: "extracts", exintro: "1", explaintext: "1", redirects: "1",
        titles: c.title, format: "json", formatversion: "2", origin: "*" });
      liveCache.set(c.id, fetch("https://en.wikipedia.org/w/api.php?" + q)
        .then(r => r.ok ? r.json() : null)
        .then(d => d && d.query && d.query.pages && d.query.pages[0] && d.query.pages[0].extract || null)
        .catch(() => null));
    }
    return liveCache.get(c.id);
  }
  // Drop pronunciation and native-script asides from the opening sentence, and tidy
  function clean(text) {
    return text
      .replace(/\s*\((?:[^()]*\([^()]*\))*[^()]*\)/, m => /[:;\[]|pronounced|listen|[^\u0000-ɏ‘-”]/i.test(m) ? "" : m)
      .replace(/\s*\[\d+\]/g, "").replace(/\.\./g, ".").replace(/\s+([,.;])/g, "$1").trim();
  }
  function shortIntro(text, limit) {
    const first = clean(text.split(/\n+/).find(p => p.trim()) || "");
    const sentences = first.match(/[^.!?]+[.!?]+["”’)]?\s*|[^.!?]+$/g) || [first];
    let out = "";
    for (const s of sentences) { if (out && (out + s).length > limit) break; out += s; }
    return out.trim();
  }
  function fillIntro(c) {
    const intro = document.getElementById("intro");
    if (!intro || selected !== c) return;
    const show = text => {
      const paras = text.split(/\n+/).map(t => clean(t.trim())).filter(Boolean);
      const short = shortIntro(text, isPhone() ? 220 : 300);
      const rest = paras.join(" ").length > short.length + 40;
      intro.innerHTML = `<p>${esc(short)}</p>` + (rest ? `<button class="more" type="button">Read more of the intro</button>` : "");
      const more = intro.querySelector(".more");
      if (more) more.addEventListener("click", () => {
        intro.innerHTML = paras.map(p => `<p>${esc(p)}</p>`).join("");
        if (isPhone()) panel.classList.add("full");
      });
    };
    const text = summaries[c.title];
    if (text) return show(text);
    intro.innerHTML = c.desc ? `<p>${esc(capital(c.desc))}.</p>` : "";
    liveIntro(c).then(t => { if (t && selected === c && document.getElementById("intro") === intro) show(t); });
  }

  function open(c, { fly = true } = {}) {
    if (!c) return;
    selected = c;
    beyondBtn.setAttribute("aria-pressed", "false");
    controls.autoRotate = false;
    if (c.iso3) setFocus([c.iso3]);
    render(c);
    showPanel();
    refresh();
    const s = slug(c.id);
    if (location.hash.slice(1) !== s) setHash(s);
    const target = placeOf(c) || (c.arc && nationalByIso.get(c.arc.to)?.loc) || (c.iso3 && nationalByIso.get(c.iso3)?.loc);
    if (!target || !fly) return;
    // Zoom closer for regions (sized to the region), and keep the place clear of the card
    const reg = regionOf.get(c.id);
    let alt = c.kind === "national" ? ((local.get(c.iso3) || []).length > 6 ? 1.35 : 1.7) : 1.1;
    if (reg) alt = Math.min(1.2, Math.max(0.45, 0.3 + reg.properties.size / 28));
    const phone = isPhone();
    world.pointOfView({
      lat: target[0] - (phone ? alt * 11 : 0),
      lng: target[1] + (phone ? 0 : alt * 9),
      altitude: alt,
    }, reduceMotion ? 0 : 1100);
  }

  const ARROW = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  function render(c) {
    const col = colorOf(c);
    const parent = (c.parents || []).map(p => byId.get(p)).find(Boolean);
    const trail = [];
    if ((c.region || [])[0]) trail.push(CONTINENT[c.region[0]] || c.region[0]);
    if (parent && parent !== c) trail.push(`<button data-id="${attr(parent.id)}">${esc(parent.name)}</button>`);
    crumbs.innerHTML = trail.join(" / ");

    const country = c.iso3 && isoName.get(c.iso3);
    const kindLine = c.kind === "diaspora" && c.arc
      ? `Diaspora cuisine, from ${esc(isoName.get(c.arc.from) || c.arc.from)} to ${esc(isoName.get(c.arc.to) || c.arc.to)}`
      : esc(KIND_LABEL[c.kind] || "") + (country && c.kind !== "national" ? ` in ${esc(country)}` : country ? ` of ${esc(country)}` : "");

    const p = picks[c.id] || c.picks || null;
    const sug = suggestions[c.id] || {};
    const sites = merge(p && p.sites, sug.sites, "url");
    const books = merge(p && p.cookbooks, sug.cookbooks, "title");
    // Nothing of its own yet: borrow from the nearest parent cuisine that has some
    let from = null, fromSites = [], fromBooks = [];
    if (!sites.length && !books.length) {
      for (let cur = c, i = 0; cur && i < 4; i++) {
        cur = (cur.parents || []).map(id => byId.get(id)).find(Boolean) || (cur.kind !== "national" && cur.iso3 ? nationalByIso.get(cur.iso3) : null);
        if (!cur || cur === c) break;
        const cp = picks[cur.id] || {}, cs = suggestions[cur.id] || {};
        fromSites = merge(cp.sites, cs.sites, "url").slice(0, 3);
        fromBooks = merge(cp.cookbooks, cs.cookbooks, "title").slice(0, 4);
        if (fromSites.length || fromBooks.length) { from = cur; break; }
      }
    }
    const kids = (c.children || []).map(k => byId.get(k)).filter(Boolean);
    const others = c.kind === "national" ? (local.get(c.iso3) || []).filter(o => !(c.children || []).includes(o.id)) : [];
    const sameArea = (regionOf.get(c.id)?.properties.ids || []).filter(id => id !== c.id).map(id => byId.get(id));
    // Routes out of and into this country (or this cuisine)
    const iso = c.kind === "national" ? c.iso3 : null;
    const routes = arcs.filter(a => a.c !== c && (a.from === c || a.to === c || (iso && (a.from.iso3 === iso || a.to.iso3 === iso))))
      .map(a => ({ cuisine: a.c, from: a.from.iso3, to: a.to.iso3 }));
    const carried = routes.filter(r => iso ? r.from === iso : r.from === c.iso3);
    const arrived = routes.filter(r => !carried.includes(r));
    const routeList = (rs, side) => `<ul class="connections">${rs.map(r =>
      `<li><button data-id="${attr(r.cuisine.id)}"><span>${esc(r.cuisine.name)}</span> <span>${side === "to" ? "in " + esc(isoName.get(r.to) || "") : "from " + esc(isoName.get(r.from) || "")}</span></button></li>`).join("")}</ul>`;

    body.style.setProperty("--accent", col);
    panel.style.setProperty("--accent", col);
    body.innerHTML = `
      <h2>${esc(c.name)}</h2>
      <p class="kind"><i style="background:${col}"></i>${kindLine}</p>
      <div class="intro" id="intro"></div>
      ${p && p.note ? `<p class="intro"><em>${esc(p.note)}</em></p>` : ""}

      ${from ? `
      <h3>Start with ${esc(from.name.replace(/ cuisine$/, ""))} cooking</h3>
      <p class="empty">Nothing specific to ${esc(c.name.replace(/ cuisine$/, ""))} cooking here yet, so here's where to start from <button class="link" data-id="${attr(from.id)}">${esc(from.name)}</button>.</p>
      ${fromSites.length ? `<ul class="sites" style="margin-top:10px">${fromSites.map(site).join("")}</ul>` : ""}
      ${fromBooks.length ? `<div class="books" style="margin-top:12px">${fromBooks.map(book).join("")}</div>` : ""}
      ` : `
      <h3>Recipe sites</h3>
      ${sites.length ? `<ul class="sites">${sites.map(site).join("")}</ul>` : `<p class="empty">No recipe sites for this one yet.</p>`}
      ${books.length ? `<h3>Cookbooks</h3><div class="books">${books.map(book).join("")}</div>` : ""}`}

      <a class="wiki-btn" href="${attr(c.url)}" target="_blank" rel="noopener">Read the full article on Wikipedia ${ARROW}</a>
      <p class="source">Summary from Wikipedia, shared under CC BY-SA.</p>

      ${sameArea.length ? `<h3>Also from this area</h3><div class="chips">${sameArea.map(chip).join("")}</div>` : ""}
      ${kids.length ? `<h3>Within ${esc(c.name.replace(/ cuisine$/, ""))} cooking</h3><div class="chips">${kids.map(chip).join("")}</div>` : ""}
      ${others.length ? `<h3>More from ${esc(country)}</h3><div class="chips">${others.map(chip).join("")}</div>` : ""}
      ${carried.length ? `<h3>Carried abroad</h3>${routeList(carried, "to")}` : ""}
      ${arrived.length ? `<h3>Arrived from elsewhere</h3>${routeList(arrived, "from")}` : ""}
    `;
    fillIntro(c);
  }

  function showBeyond() {
    selected = null;
    refresh();
    beyondBtn.setAttribute("aria-pressed", "true");
    crumbs.textContent = "";
    const groups = [
      ["peoples", "Peoples and places without their own country"],
      ["diaspora", "Diaspora and fusion"],
      ["religious", "Religious cuisines and diets"],
      ["historical", "Historical cuisines"],
      ["style", "Styles of cooking"],
    ];
    panel.style.setProperty("--accent", "var(--rice)");
    body.innerHTML = `
      <h2>Beyond borders</h2>
      <p class="intro">Plenty of the world's cooking doesn't fit inside one country: food carried by people across borders, shaped by faith, or from empires that no longer exist.</p>
      ${groups.map(([k, label]) => {
        const items = beyond.filter(c => c.kind === k).sort((a, b) => a.name.localeCompare(b.name));
        return items.length ? `<h3>${label}</h3><div class="chips">${items.map(chip).join("")}</div>` : "";
      }).join("")}`;
    showPanel();
  }

  panel.addEventListener("click", e => {
    const b = e.target.closest("[data-id]");
    if (b) open(byId.get(b.dataset.id));
  });

  // Hand picks first, then research suggestions (tagged), without duplicates
  function merge(mine, suggested, key) {
    const out = (mine || []).map(x => ({ ...x, suggested: false }));
    for (const x of suggested || []) if (!out.some(m => m[key] && m[key] === x[key])) out.push({ ...x, suggested: true });
    return out;
  }
  function chip(c) { return `<button class="chip" data-id="${attr(c.id)}">${esc(c.name)}</button>`; }
  const TYPE = { youtube: "YouTube", blog: "Blog", magazine: "Magazine", site: "Website" };
  function site(s) {
    let host = "";
    try { host = new URL(s.url).hostname.replace(/^www\./, ""); } catch (e) {}
    return `<li><a class="site" href="${attr(s.url)}" target="_blank" rel="noopener">
      <div><strong>${esc(s.name)}${s.suggested ? `<span class="tag">Suggested</span>` : ""}</strong>
      <small><span class="host">${esc(TYPE[s.type] || "Website")}${host ? ", " + esc(host) : ""}</span>${s.note ? `<br>${esc(s.note)}` : ""}</small></div>${ARROW}</a></li>`;
  }
  function book(b) {
    const cover = b.isbn ? `<img alt="" loading="lazy" src="https://covers.openlibrary.org/b/isbn/${attr(b.isbn)}-M.jpg?default=false" onload="this.nextElementSibling.hidden=true" onerror="this.remove()">` : "";
    const href = b.url || (b.isbn ? `https://openlibrary.org/isbn/${b.isbn}` : null);
    const inner = `<div class="cover">${cover}<span>${esc(b.title)}</span></div><div class="meta"><b>${esc(b.title)}</b>${esc(b.author || "")}${b.year ? `, ${b.year}` : ""}${b.suggested ? `<br><span class="tag" style="margin:4px 0 0">Suggested</span>` : ""}</div>`;
    return href ? `<a class="book" href="${attr(href)}" target="_blank" rel="noopener" title="${attr(b.note || "")}">${inner}</a>` : `<div class="book" title="${attr(b.note || "")}">${inner}</div>`;
  }
  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
  function attr(s) { return esc(s); }
  function capital(s) { return s.charAt(0).toUpperCase() + s.slice(1).replace(/\.$/, ""); }

  // --- Search -------------------------------------------------------------------
  const q = document.getElementById("q");
  const list = document.getElementById("results");
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const index = all.map(c => ({ c, n: norm(c.name), place: norm(c.iso3 ? (isoName.get(c.iso3) || "") : "") }));
  let matches = [], active = -1;
  function search() {
    const t = norm(q.value.trim());
    if (!t) { list.classList.remove("open"); q.setAttribute("aria-expanded", "false"); return; }
    matches = index
      .map(x => ({ x, s: x.n.startsWith(t) ? 0 : x.n.includes(" " + t) ? 1 : x.n.includes(t) ? 2 : x.place.startsWith(t) ? 3 : 9 }))
      .filter(m => m.s < 9)
      .sort((a, b) => a.s - b.s || (a.x.c.kind === "national" ? -1 : 0) - (b.x.c.kind === "national" ? -1 : 0) || a.x.n.length - b.x.n.length)
      .slice(0, 8).map(m => m.x.c);
    active = matches.length ? 0 : -1;
    list.innerHTML = matches.length
      ? matches.map((c, i) => `<li role="option" id="opt-${i}" aria-selected="${i === active}" data-i="${i}">${esc(c.name)}<small>${esc(c.iso3 ? (isoName.get(c.iso3) || "") : KIND_LABEL[c.kind])}</small></li>`).join("")
      : `<li role="option" aria-disabled="true">No cuisine by that name. Try a country or region.</li>`;
    list.classList.add("open"); q.setAttribute("aria-expanded", "true");
    q.setAttribute("aria-activedescendant", active >= 0 ? "opt-0" : "");
  }
  function pick(i) { const c = matches[i]; if (!c) return; q.value = ""; search(); q.blur(); open(c); }
  q.addEventListener("input", search);
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); if (!matches.length) return;
      active = (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) % matches.length;
      [...list.children].forEach((li, i) => li.setAttribute("aria-selected", String(i === active)));
      q.setAttribute("aria-activedescendant", "opt-" + active);
    } else if (e.key === "Enter") { e.preventDefault(); pick(active); }
    else if (e.key === "Escape") { q.value = ""; search(); }
  });
  list.addEventListener("mousedown", e => { const li = e.target.closest("[data-i]"); if (li) { e.preventDefault(); pick(+li.dataset.i); } });
  q.addEventListener("blur", () => setTimeout(() => list.classList.remove("open"), 120));

  // Deep links: #thai-cuisine
  function fromHash() {
    const c = bySlug.get(location.hash.slice(1));
    if (c && c !== selected) open(c);
  }
  addEventListener("hashchange", fromHash);
  fromHash();
})();
</script>
</body>
</html>
