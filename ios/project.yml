# XcodeGen spec. Generate the Xcode project with: xcodegen generate
name: Cuisines
options:
  bundleIdPrefix: net.kylepace
  deploymentTarget:
    iOS: "26.0"
packages:
  KitchenUI:
    path: ../../KitchenUI
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 9BF66MY8TQ
    CODE_SIGN_STYLE: Automatic
    # Empty for TestFlight and the App Store. install-on-iphone.sh sets them to ".dev",
    # " Dev" and "Dev" so the phone build is "Cuisines Dev" with a DEV icon, next to the real app.
    BUNDLE_ID_SUFFIX: ""
    APP_NAME_SUFFIX: ""
    APP_ICON_SUFFIX: ""
targets:
  Cuisines:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: KitchenUI
      - target: CuisinesWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.kylepace.cuisines$(BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: Cuisines
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # One universal app: iPhone and iPad
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Cuisines$(APP_NAME_SUFFIX)"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPhone stays portrait; iPad turns every way (and so works in Split View, Stage Manager
        # and resizable windows)
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon$(APP_ICON_SUFFIX)
    info:
      path: Sources/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: net.kylepace.cuisines
            CFBundleURLSchemes: [cuisines]
        # How Siri says the app's name (the dev build is "Cuisines Dev")
        CFBundleSpokenName: "Cuisines$(APP_NAME_SUFFIX)"
        UILaunchScreen:
          UIColorName: ""

  # Home Screen widget: today's dish (Widget/CuisinesWidget.swift)
  CuisinesWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - path: Sources/Remote.swift
      - path: Sources/Daily.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.kylepace.cuisines$(BUNDLE_ID_SUFFIX).widget
        PRODUCT_NAME: CuisinesWidget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Cuisines$(APP_NAME_SUFFIX)"
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "Cuisines$(APP_NAME_SUFFIX)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
