<!DOCTYPE html>
<!-- Dish drop's share card. Render to drop-share.png with:
     node scripts/render-og.mjs drop   (1200x630, dark, Atkinson) -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../vendor/fonts/atkinson.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1b1424; color: #ede6da; font-family: "Atkinson Hyperlegible Next", sans-serif; position: relative; }
  /* The globe's edge, quiet, on the right */
  .globe { position: absolute; right: -180px; top: 40px; width: 720px; height: 720px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #3a3045, #231a2e 70%); box-shadow: 0 0 0 14px rgba(111, 86, 144, 0.18); }
  .pin { position: absolute; font-weight: 800; font-size: 26px; padding: 10px 16px; }
  .pin::after { content: ""; position: absolute; left: 50%; bottom: -10px; width: 18px; height: 18px; background: inherit; transform: translateX(-50%) rotate(45deg); z-index: -1; }
  .you { left: 690px; top: 300px; background: #f0b340; color: #241b2f; }
  .here { left: 900px; top: 220px; background: #ede6da; color: #a8381a; border: 3px solid #a8381a; }
  svg.arc { position: absolute; left: 760px; top: 190px; }
  .ticket-wrap { position: absolute; left: 80px; top: 60px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.5)); transform: rotate(-3deg); }
  .ticket { width: 420px; background: #ede6da; color: #241b2f; padding: 26px 28px 46px;
    mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 22px 100%; }
  .top { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px dashed #241b2f; padding-bottom: 12px; margin-bottom: 18px; }
  .top b { font-size: 34px; font-weight: 800; }
  .top span { font-size: 22px; font-weight: 600; color: #5b4f66; }
  .plate { height: 220px; background: #c4783c; display: grid; place-items: center; }
  .plate i { width: 230px; height: 170px; border-radius: 50%; background: #f0e1c8; display: grid; place-items: center; }
  .plate i::after { content: ""; width: 130px; height: 90px; border-radius: 50%; background: #a8381a; }
  .q { font-size: 32px; font-weight: 800; margin: 20px 0 0; }
  h1 { position: absolute; left: 80px; bottom: 40px; margin: 0; font-size: 30px; font-weight: 600; color: #b3a9be; }
  h1 b { color: #ede6da; font-weight: 800; }
</style>
</head>
<body>
  <div class="globe"></div>
  <svg class="arc" width="180" height="140" viewBox="0 0 180 140"><path d="M10 130 Q 80 -10 170 60" fill="none" stroke="#f0b340" stroke-width="6" stroke-dasharray="18 8"/></svg>
  <div class="pin here">Bulgarian</div>
  <div class="pin you">Your pin</div>
  <div class="ticket-wrap"><div class="ticket">
    <div class="top"><b>Order 1 of 5</b><span>Dish drop</span></div>
    <div class="plate"><i></i></div>
    <p class="q">Where is this from?</p>
  </div></div>
  <h1><b>Dish drop</b> on World cuisine: five dishes a day</h1>
</body>
</html>
