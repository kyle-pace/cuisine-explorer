<!doctype html><html><head><meta charset="utf-8"><style>
/* Share card for kylepace.dev/world-cuisine/ingredient-map/ (ingredient-map-share.png).
   Render with: node scripts/render-og.mjs ingredient-map. The map is the real one
   ({{SVG}} comes from scripts/ingredient_map_svg.mjs), with lemongrass lit. */
@font-face{font-family:A;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-400-normal.woff2")}
@font-face{font-family:A;font-weight:700;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-700-normal.woff2")}
html,body{margin:0}
body{width:1200px;height:630px;background:#1b1424;color:#ede6da;font-family:A;overflow:hidden;position:relative}
.text{position:absolute;left:64px;top:64px;bottom:64px;width:400px;display:flex;flex-direction:column;justify-content:space-between;z-index:2}
.site{font-size:26px;color:#b8acc7}
h1{margin:0;font-size:84px;line-height:1;letter-spacing:-0.02em;font-weight:700}
.sub{margin:24px 0 0;font-size:30px;line-height:1.3;color:#d6cdc0}
.map{position:absolute;left:299px;top:-210px;width:1364px;height:990px}
.map svg{width:100%;height:100%;font-family:A}
.links line{stroke:#4a3f57}.links line.x:not(.on){display:none}
.grounds circle{fill:#241b2f;stroke:#3a3045;stroke-width:1.5}
.hoods text{fill:#f0b340;font-size:22px;font-weight:700;paint-order:stroke;stroke:#1b1424;stroke-width:6px}
.hit{fill:transparent}.dot{fill:#8a7a9c;stroke:#ede6da;stroke-width:1.5}
.lab{fill:#ede6da;font-size:15px;paint-order:stroke;stroke:#1b1424;stroke-width:5px;stroke-linejoin:round}.lab.more{display:none}
svg.active .dots .ing:not(.on){opacity:.3}svg.active .links line:not(.on){opacity:.25}svg.active .hoods text{opacity:.5}
.ing.on .lab.more{display:inline}.ing.on .dot{fill:#ede6da}.ing.me .dot{fill:#f0b340;stroke:#f0b340}.ing.me .lab{font-weight:700;font-size:17px}
.links line.on{stroke:#f0b340;stroke-width:3}
.fade{position:absolute;left:0;top:0;bottom:0;width:640px;background:linear-gradient(90deg,#1b1424 72%,rgba(27,20,36,0));z-index:1}
</style></head><body>
<div class="map">{{SVG}}</div>
<div class="fade"></div>
<div class="text">
  <div class="site">kylepace.dev/world-cuisine</div>
  <div><h1>Ingredient map</h1><p class="sub">{{COUNT}} ingredients in {{HOODS}} neighborhoods of what’s cooked together.</p></div>
  <div class="site">Lemongrass sits with galangal, ginger and turmeric</div>
</div>
</body></html>
