<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuisine Explorer: the web</title>
<meta name="description" content="Every cuisine, dish, ingredient, recipe site and cookbook in the Cuisine Explorer as linked pages, with backlinks and a graph.">
<meta property="og:title" content="Cuisine Explorer: the web">
<meta property="og:description" content="The world's cuisines, dishes and ingredients as a web of linked pages.">
<meta property="og:image" content="https://kylepace.net/labs/cuisines/share.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1b1424">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1b1424; --panel: #241b2f; --panel-2: #2e2439; --line: #4a3f57;
    --rice: #ede6da; --muted: #a99fb5;
    --saffron: #f0b340; --beet: #cf5f87; --chili: #e46a3f; --tomatillo: #94bd5c; --seaglass: #55b8ad;
    --font: "Atkinson Hyperlegible Next", system-ui, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); color: var(--rice); font-family: var(--font); font-size: 16px; line-height: 1.55; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; border-radius: 4px; }

  /* Top bar: name, Globe and Web, search, graph */
  .top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 12px 28px;
    background: rgba(27, 20, 36, 0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .brand { font-weight: 800; font-size: 1.15rem; letter-spacing: -0.01em; text-decoration: none; white-space: nowrap; }
  .views { display: flex; gap: 4px; padding: 3px; background: var(--panel-2); border-radius: 999px; }
  .views a { text-decoration: none; padding: 5px 14px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; color: var(--muted); }
  .views a[aria-current="page"] { background: var(--rice); color: var(--night); }
  .search { position: relative; flex: 1; max-width: 420px; margin-left: auto; }
  .search input { width: 100%; padding: 9px 14px 9px 38px; border-radius: 22px; border: 1px solid var(--line);
    background: var(--panel); color: var(--rice); font: inherit; -webkit-appearance: none; appearance: none; }
  .search input::placeholder { color: var(--muted); }
  .search svg { position: absolute; left: 14px; top: 12px; width: 15px; height: 15px; stroke: var(--muted); pointer-events: none; }
  .results { list-style: none; margin: 6px 0 0; padding: 6px; position: absolute; left: 0; right: 0; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; max-height: 60vh; overflow: auto; display: none; }
  .results.open { display: block; }
  .results li { padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  .results li small { color: var(--muted); white-space: nowrap; }
  .results li[aria-selected="true"], .results li:hover { background: var(--panel-2); }
  .results .group { padding: 10px 10px 4px; font-size: 0.78rem; font-weight: 700; color: var(--muted); cursor: default; }
  .results .group:hover { background: none; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 0.9rem; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover { border-color: var(--muted); }
  .btn.solid { background: var(--rice); color: var(--night); border-color: var(--rice); }
  .btn.solid:hover { background: #fff8ec; }
  .btn svg { width: 16px; height: 16px; flex: none; }

  /* Page and its connections */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 48px; max-width: 1200px; margin: 0 auto; padding: 36px 28px 80px; }
  .page { min-width: 0; max-width: 70ch; }
  .layout.solo { grid-template-columns: minmax(0, 1fr); }
  .layout.solo .page { max-width: 90ch; }
  .side { position: sticky; top: 84px; align-self: start; }
  .crumb { color: var(--muted); font-size: 0.88rem; margin: 0 0 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .crumb a { text-underline-offset: 2px; }
  .page h1 { font-weight: 800; letter-spacing: -0.02em; font-size: clamp(2rem, 4vw, 2.8rem); line-height: 1.08; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 18px; display: flex; align-items: center; gap: 8px; }
  .sub i, .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .intro { font-size: 1.06rem; }
  .intro p { margin: 0 0 12px; }
  .source { font-size: 0.82rem; color: var(--muted); margin: 0 0 4px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 8px; }
  .page h2 { font-weight: 700; font-size: 1.25rem; margin: 36px 0 12px; display: flex; align-items: baseline; gap: 8px; }
  .page h2 small { color: var(--muted); font-weight: 400; font-size: 0.9rem; }
  .page h3 { font-size: 1rem; margin: 22px 0 8px; color: var(--muted); }
  .empty { color: var(--muted); margin: 0; }
  .tag { display: inline-block; font-size: 0.72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; margin-left: 6px; vertical-align: 2px; font-weight: 400; }

  /* Lists of linked things: internal links look like Obsidian's, plain underlined text */
  .links { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 0; padding: 0; list-style: none; }
  .links a, .inline a { text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--rice) 45%, transparent); text-underline-offset: 3px; }
  .links a:hover, .inline a:hover { text-decoration-color: var(--rice); }
  .links li:not(:last-child)::after { content: "·"; color: var(--line); margin-left: 8px; }
  .rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .row > div { flex: 1; min-width: 0; }
  .row a.name { font-weight: 700; text-decoration: none; }
  .row a.name:hover { text-decoration: underline; text-underline-offset: 3px; }
  .row small { display: block; color: var(--muted); font-size: 0.88rem; line-height: 1.4; margin-top: 2px; }
  .row .out { flex: none; color: var(--muted); padding: 4px; border-radius: 6px; }
  .row .out:hover { color: var(--rice); background: var(--panel-2); }
  .row .out svg { width: 18px; height: 18px; display: block; }
  .row .mark { width: 10px; height: 10px; margin-top: 8px; flex: none; }
  .grouped { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .grouped > li { border-top: 1px solid var(--line); padding-top: 12px; }
  .grouped > li:first-child { border-top: 0; padding-top: 0; }
  .grouped b a { text-decoration: none; }
  .grouped b a:hover { text-decoration: underline; }
  .grouped .n { color: var(--muted); font-size: 0.85rem; font-weight: 400; }
  .grouped .links { margin-top: 6px; }
  .letters { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 16px; }
  .letters a { min-width: 32px; text-align: center; padding: 4px 6px; border-radius: 8px; text-decoration: none; background: var(--panel); border: 1px solid var(--line); font-weight: 600; font-size: 0.9rem; }
  .letters a[aria-current="true"] { background: var(--rice); color: var(--night); border-color: var(--rice); }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 0; padding: 0; list-style: none; }
  .stats a { display: block; text-decoration: none; padding: 12px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-width: 120px; }
  .stats a:hover { border-color: var(--muted); }
  .stats b { display: block; font-size: 1.5rem; font-weight: 800; line-height: 1.1; }
  .stats span { color: var(--muted); font-size: 0.9rem; }
  .cover { width: 120px; aspect-ratio: 2 / 3; border-radius: 3px 6px 6px 3px; overflow: hidden; position: relative; background: var(--panel-2);
    box-shadow: inset 6px 0 0 rgba(0,0,0,0.18); display: flex; align-items: flex-end; padding: 10px 8px 10px 14px; font-weight: 700; font-size: 0.85rem; line-height: 1.15; float: right; margin: 0 0 12px 20px; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .correct { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.88rem; }

  /* Connections: the local graph */
  .side h2 { font-size: 0.95rem; margin: 0 0 8px; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  .local { height: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; position: relative; }
  .key { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 10px 0 12px; font-size: 0.8rem; color: var(--muted); }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key svg { width: 11px; height: 11px; }
  .side .btn { width: 100%; justify-content: center; }

  /* The whole web */
  .full { position: fixed; inset: 0; z-index: 10; background: var(--night); display: none; }
  .full.open { display: block; }
  .full-bar { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 20px;
    background: linear-gradient(var(--night) 60%, transparent); }
  .full-bar h2 { margin: 0 12px 0 0; font-size: 1.1rem; }
  .full-bar .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 7px; }
  .full-bar .chip[aria-pressed="false"] { opacity: 0.55; }
  .full-bar .chip svg { width: 11px; height: 11px; }
  .full-bar .close { margin-left: auto; }
  .full-hint { position: absolute; left: 20px; bottom: 16px; z-index: 2; color: var(--muted); font-size: 0.85rem; margin: 0; max-width: 46ch; }
  .tip { position: fixed; z-index: 12; pointer-events: none; background: var(--rice); color: var(--night); font-weight: 600; font-size: 0.85rem; padding: 4px 10px; border-radius: 999px; display: none; white-space: nowrap; }
  .loading { padding: 80px 28px; text-align: center; color: var(--muted); }

  @media (prefers-reduced-motion: no-preference) {
    .page { animation: rise 0.22s var(--ease); }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 32px; padding: 24px 18px 64px; }
    .side { position: static; }
    .local { height: 280px; }
    .top { flex-wrap: wrap; padding: 10px 18px; gap: 10px; }
    .search { order: 3; flex-basis: 100%; max-width: none; }
    .top .btn { margin-left: auto; }
    .cover { width: 96px; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">Cuisine Explorer</a>
  <nav class="views" aria-label="Views">
    <a id="to-globe" href="./">Globe</a>
    <a href="#/" aria-current="page">Web</a>
  </nav>
  <div class="search" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search cuisines, dishes, ingredients, sites, books" autocomplete="off" enterkeyhint="go"
           aria-label="Search the web of cuisines" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
    <ul class="results" id="results" role="listbox" aria-label="Matches"></ul>
  </div>
  <button class="btn" id="open-graph" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="5" cy="6" r="2.5"/><circle cx="18" cy="5" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M7.3 7.2 10.6 16M16.5 7.1 13.2 15.9M7.5 6h8"/></svg>
    Graph</button>
</header>

<div class="layout" id="layout">
  <main class="page" id="page" tabindex="-1"><p class="loading">Setting the table…</p></main>
  <aside class="side" id="side" aria-label="Connections">
    <h2>Connections</h2>
    <div class="local" id="local" aria-hidden="true"></div>
    <div class="key" id="key" aria-hidden="true"></div>
    <button class="btn" id="open-graph-2" type="button">Open the whole web</button>
  </aside>
</div>

<div class="full" id="full" role="dialog" aria-modal="true" aria-label="The whole web">
  <div class="full-bar">
    <h2>The whole web</h2>
    <span id="filters"></span>
    <button class="btn close" id="close-graph" type="button">Close</button>
  </div>
  <div id="graph" aria-hidden="true"></div>
  <p class="full-hint">Drag to move, scroll or pinch to zoom, pick a dot to open its page. Every connection here is also listed as a link on its page.</p>
</div>
<div class="tip" id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/force-graph@1.52.0/dist/force-graph.min.js"></script>
<!--INLINE_DATA-->
<script>
(async function () {
  // --- Data ------------------------------------------------------------------
  async function load(id, path) {
    const el = document.getElementById(id);
    if (el) return JSON.parse(el.textContent);
    const r = await fetch(path);
    if (!r.ok) throw new Error(path);
    return r.json();
  }
  const [data, countries, picksFile, suggestionsFile, food, notesFile] = await Promise.all([
    load("data-cuisines", "data/cuisines.json"),
    load("data-countries", "data/countries.geojson"),
    load("data-picks", "data/picks.json").catch(() => ({})),
    load("data-suggestions", "data/suggestions.json").catch(() => ({})),
    load("data-food", "data/food.json").catch(() => ({ dishes: [], ingredients: [] })),
    load("data-notes", "data/notes.json").catch(() => ({})),
  ]);
  let summaries = {}, foodSummaries = {};
  const later = Promise.all([
    load("data-summaries", "data/summaries.json").then(d => { summaries = d || {}; }).catch(() => {}),
    load("data-food_summaries", "data/food_summaries.json").then(d => { foodSummaries = d || {}; }).catch(() => {}),
  ]);
  const notes = { cuisines: {}, dishes: {}, ingredients: {}, ...(notesFile || {}) };
  const picks = picksFile.cuisines || {};
  const suggestions = suggestionsFile.cuisines || {};

  const COLORS = { "African cuisine": "#e46a3f", "Cuisine of the Americas": "#94bd5c", "Asian cuisine": "#f0b340", "European cuisine": "#cf5f87", "Oceanic cuisine": "#55b8ad" };
  const CONTINENT = { "African cuisine": "Africa", "Cuisine of the Americas": "The Americas", "Asian cuisine": "Asia", "European cuisine": "Europe", "Oceanic cuisine": "Oceania" };
  const NEUTRAL = "#a99fb5";
  const KIND_LABEL = { national: "National cuisine", regional: "Regional cuisine", diaspora: "Diaspora cuisine", peoples: "Cuisine of a people",
    religious: "Religious cuisine or diet", historical: "Historical cuisine", style: "Style of cooking" };
  const TYPE_LABEL = { cuisine: "Cuisine", dish: "Dish", ingredient: "Ingredient", site: "Recipe site", book: "Cookbook" };
  const PLURAL = { cuisine: "Cuisines", dish: "Dishes", ingredient: "Ingredients", site: "Recipe sites", book: "Cookbooks" };
  const PATH = { cuisine: "cuisine", dish: "dish", ingredient: "ingredient", site: "site", book: "cookbook" };
  const CORRECT = "https://github.com/kyle-pace/cuisine-explorer/issues/new?title=";
  const ARROW = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  const slug = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const capital = s => s.charAt(0).toUpperCase() + s.slice(1).replace(/\.$/, "");
  const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
  const isoName = new Map(countries.features.map(f => {
    const p = f.properties;
    return [p.ISO_A3_EH !== "-99" ? p.ISO_A3_EH : p.ADM0_A3, p.NAME];
  }));
  countries.features.forEach(f => isoName.set(f.properties.ADM0_A3, f.properties.NAME));

  // --- The web: every thing is a node, every relation an edge both ways ------
  const nodes = new Map();          // key -> node
  const add = (type, id, props) => {
    const key = type + ":" + id;
    if (!nodes.has(key)) nodes.set(key, { key, type, id, out: new Map(), ...props });
    return nodes.get(key);
  };
  // rel names the edge from a's side; back names it from b's side
  function link(a, b, rel, back, extra) {
    if (!a || !b || a === b) return;
    if (!a.out.has(b.key)) a.out.set(b.key, { node: b, rel, ...extra });
    if (!b.out.has(a.key)) b.out.set(a.key, { node: a, rel: back, ...extra });
  }

  const all = data.cuisines;
  const byId = new Map(all.map(c => [c.id, c]));
  const nationalByIso = new Map(all.filter(c => c.kind === "national").map(c => [c.iso3, c]));
  const colorOf = c => COLORS[(c.region || [])[0]] || (c.iso3 && nationalByIso.get(c.iso3) && COLORS[(nationalByIso.get(c.iso3).region || [])[0]]) || NEUTRAL;
  for (const c of all) add("cuisine", c.id, { name: c.name, c, color: colorOf(c) });
  for (const c of all) for (const p of c.parents || []) link(nodes.get("cuisine:" + c.id), nodes.get("cuisine:" + p), "parent", "child");

  const dishes = (food.dishes || []).filter(d => d.cuisines.some(id => byId.has(id)));
  const ingById = new Map((food.ingredients || []).map(i => [i.id, i]));
  for (const d of dishes) {
    const dn = add("dish", d.id, { name: d.name, d, color: "#ede6da" });
    for (const cid of d.cuisines) if (byId.has(cid)) link(dn, nodes.get("cuisine:" + cid), "cuisine", "dish");
    for (const iid of d.ingredients || []) {
      const i = ingById.get(iid);
      if (!i) continue;
      link(dn, add("ingredient", i.id, { name: i.name, i, color: "#c9b8dd" }), "ingredient", "dish");
    }
  }

  // Ingredients with a note of their own get a page even before a dish uses them
  for (const id of Object.keys(notes.ingredients || {})) { const i = ingById.get(id); if (i) add("ingredient", i.id, { name: i.name, i, color: "#c9b8dd" }); }

  // Recipe sites (one node per site, by host) and cookbooks (one per title)
  const shelves = new Map(); // cuisine id -> { sites, books }
  const addShelf = (cid, list, suggested) => {
    for (const s of list.sites || []) {
      const host = hostOf(s.url);
      if (!host) continue;
      const n = add("site", host, { name: s.name, host, color: "#55b8ad", names: new Map() });
      n.names.set(s.name, (n.names.get(s.name) || 0) + 1);
      link(n, nodes.get("cuisine:" + cid), "cuisine", "site", { entry: { ...s, suggested } });
    }
    for (const b of list.cookbooks || []) {
      const n = add("book", slug(b.title), { name: b.title, b, color: "#f0b340" });
      link(n, nodes.get("cuisine:" + cid), "cuisine", "book", { entry: { ...b, suggested } });
    }
  };
  for (const [cid, list] of Object.entries(picks)) if (byId.has(cid)) addShelf(cid, list, false);
  for (const [cid, list] of Object.entries(suggestions)) if (byId.has(cid)) addShelf(cid, list, true);
  for (const [cid, n] of Object.entries(notes.cuisines)) if (byId.has(cid)) addShelf(cid, { sites: n.sites, cookbooks: n.cookbooks }, true);
  for (const n of nodes.values()) if (n.type === "site") n.name = [...n.names].sort((a, b) => b[1] - a[1] || a[0].length - b[0].length)[0][0];

  // Links written inside notes are connections too, like Obsidian's backlinks
  const KIND = { cuisine: "cuisine", dish: "dish", ingredient: "ingredient" };
  for (const [bucket, type] of [["cuisines", "cuisine"], ["dishes", "dish"], ["ingredients", "ingredient"]])
    for (const [id, note] of Object.entries(notes[bucket] || {}))
      for (const l of note.links || []) link(nodes.get(type + ":" + id), nodes.get(KIND[l.kind] + ":" + l.id), "mentions", "mentioned");

  const bySlug = new Map();
  for (const n of nodes.values()) { n.slug = slug(n.id); n.href = `#/${PATH[n.type]}/${n.slug}`; bySlug.set(PATH[n.type] + "/" + n.slug, n); }
  const nodeList = [...nodes.values()];
  const ofType = t => nodeList.filter(n => n.type === t);
  const edges = (n, rel) => [...n.out.values()].filter(e => !rel || e.rel === rel);
  const byName = (a, b) => a.name.localeCompare(b.name);
  const linkTo = n => `<a href="${n.href}">${esc(n.name)}</a>`;
  const linkList = list => list.length ? `<ul class="links">${list.map(n => `<li>${linkTo(n)}</li>`).join("")}</ul>` : "";

  // Links into the globe view
  const globeHash = n => n.type === "cuisine" ? slug(n.id) : n.type === "dish" ? "dish-" + slug(n.id) : n.type === "ingredient" ? "ingredient-" + slug(n.id) : "";

  // --- Text: our notes first, then Wikipedia's intro ---------------------------
  function clean(text) {
    return text.replace(/\s*\((?:[^()]*\([^()]*\))*[^()]*\)/, m => /[:;\[]|pronounced|listen|[^\u0000-ɏ‘-”]/i.test(m) ? "" : m)
      .replace(/\s*\[\d+\]/g, "").replace(/\.\./g, ".").replace(/\s+([,.;])/g, "$1").trim();
  }
  function noteHtml(n) {
    const links = new Map((n.links || []).map(l => [l.text.toLowerCase(), l]));
    return (n.text || []).map(p => `<p class="inline">${esc(p).replace(/\[\[([^\]|#]+)(?:#[^\]|]*)?(?:\|([^\]]+))?\]\]/g, (m, target, label) => {
      const l = links.get(target.trim().toLowerCase().replace(/&#39;/g, "'").replace(/&amp;/g, "&"));
      const node = l && nodes.get((l.kind === "cuisine" ? "cuisine:" : l.kind === "dish" ? "dish:" : "ingredient:") + l.id);
      return node ? `<a href="${node.href}">${label || target}</a>` : (label || target);
    })}</p>`).join("");
  }
  function noteSource(n, what) {
    const src = (n.sources || []).filter(x => x.url);
    return `<p class="source">Written for this explorer${src.length ? " from " + src.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`).join(", ") : ""}.</p>`;
  }
  const live = new Map();
  function liveIntro(title) {
    if (!live.has(title)) {
      const q = new URLSearchParams({ action: "query", prop: "extracts", exintro: "1", explaintext: "1", redirects: "1", titles: title, format: "json", formatversion: "2", origin: "*" });
      live.set(title, fetch("https://en.wikipedia.org/w/api.php?" + q).then(r => r.ok ? r.json() : null)
        .then(d => d?.query?.pages?.[0]?.extract || null).catch(() => null));
    }
    return live.get(title);
  }
  const wikiParas = text => text.split(/\n+/).map(t => clean(t.trim())).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join("");
  // Fill #intro: the note, or the stored Wikipedia intro, or fetch it live
  function fillIntro(own, title, fallback) {
    const box = document.getElementById("intro");
    if (own && (own.text || []).length) { box.innerHTML = noteHtml(own); return; }
    const show = t => { if (document.getElementById("intro") === box) box.innerHTML = wikiParas(t) + `<p class="source">Intro from Wikipedia, shared under CC BY-SA.</p>`; };
    const get = () => title && (summaries[title] || foodSummaries[title]);
    if (get()) return show(get());
    box.innerHTML = fallback ? `<p>${esc(fallback)}</p>` : "";
    if (!title) return;
    later.then(() => {
      if (get()) return show(get());
      liveIntro(title).then(t => { if (t) show(t); });
    });
  }

  // --- Pages ------------------------------------------------------------------
  const page = document.getElementById("page");
  const outLink = (url, label) => `<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${label} ${ARROW}</a>`;
  const globeBtn = n => `<a class="btn" href="./#${globeHash(n)}">Show on the globe</a>`;
  const correct = name => `<p class="correct">Something wrong or missing? <a href="${CORRECT + encodeURIComponent("Correction: " + name)}" target="_blank" rel="noopener">Suggest a correction</a>.</p>`;
  function siteRows(list) {
    return `<ul class="rows">${list.map(({ node, entry }) => `<li class="row"><span class="mark" style="background:${node.color};border-radius:2px"></span><div>
      <a class="name" href="${node.href}">${esc(node.type === "site" ? node.name : entry.title)}</a>${entry.suggested ? `<span class="tag">Suggested</span>` : ""}
      <small>${node.type === "site" ? esc(node.host) : esc([entry.author, entry.year].filter(Boolean).join(", "))}${entry.note ? `<br>${esc(entry.note)}` : ""}</small></div>
      ${entry.url || entry.isbn ? `<a class="out" href="${esc(entry.url || "https://openlibrary.org/isbn/" + entry.isbn)}" target="_blank" rel="noopener" aria-label="Open ${esc(entry.name || entry.title)}">${ARROW}</a>` : ""}</li>`).join("")}</ul>`;
  }
  const section = (title, body, count) => body ? `<h2>${title}${count ? ` <small>${count}</small>` : ""}</h2>${body}` : "";

  function cuisinePage(n) {
    const c = n.c, own = notes.cuisines[c.id];
    const country = c.iso3 && isoName.get(c.iso3);
    const kind = c.indigenous ? `Indigenous foodways${own?.area ? ", " + own.area : ""}`
      : (KIND_LABEL[c.kind] || "Cuisine") + (country ? (c.kind === "national" ? " of " : " in ") + country : "");
    const parents = edges(n, "parent").map(e => e.node);
    const kids = edges(n, "child").map(e => e.node).sort(byName);
    const ds = edges(n, "dish").map(e => e.node).sort(byName);
    const sites = edges(n, "site").sort((a, b) => a.entry.suggested - b.entry.suggested);
    const books = edges(n, "book").sort((a, b) => a.entry.suggested - b.entry.suggested);
    const count = new Map();
    for (const d of ds) for (const e of edges(d, "ingredient")) count.set(e.node, (count.get(e.node) || 0) + 1);
    const ings = [...count].sort((a, b) => b[1] - a[1]).slice(0, 24).map(([x]) => x);
    const sameCountry = c.kind === "national" ? ofType("cuisine").filter(o => o !== n && o.c.iso3 === c.iso3 && !kids.includes(o)).sort(byName) : [];
    const region = (c.region || [])[0];
    page.innerHTML = `
      <p class="crumb">${region ? `<a href="#/cuisines#${slug(CONTINENT[region] || region)}">${esc(CONTINENT[region] || region)}</a> /` : ""} ${parents.map(linkTo).join(", ") || "Cuisine"}</p>
      <h1>${esc(c.name)}</h1>
      <p class="sub"><i style="background:${n.color}"></i>${esc(kind)}</p>
      ${own?.names ? `<p class="sub">${esc(own.names)}</p>` : ""}
      <div class="intro" id="intro"></div>
      ${own ? noteSource(own) : ""}
      <div class="actions">${c.loc || c.iso3 ? globeBtn(n) : ""}${c.url ? outLink(c.url, "Wikipedia") : ""}</div>
      ${section("Recipe sites", sites.length ? siteRows(sites) : `<p class="empty">None yet${parents.length ? `. Try ${parents.map(linkTo).join(" or ")}` : ""}.</p>`, sites.length)}
      ${section("Cookbooks", books.length ? siteRows(books) : "", books.length)}
      ${section("Dishes", linkList(ds), ds.length)}
      ${section("Key ingredients", ings.length ? linkList(ings) + `<p class="source" style="margin-top:8px">Most used across its dishes.</p>` : "")}
      ${section("Part of", linkList(parents))}
      ${section(`Within ${esc(c.name.replace(/ (cuisine|foodways)$/, ""))} cooking`, linkList(kids), kids.length)}
      ${section(`More from ${esc(country || "")}`, linkList(sameCountry), sameCountry.length)}
      ${section("Mentioned in", linkList(edges(n, "mentioned").map(e => e.node).sort(byName)))}
      ${correct(c.name)}`;
    fillIntro(own, c.title, c.desc && capital(c.desc) + ".");
  }

  function dishPage(n) {
    const d = n.d, own = notes.dishes[d.id];
    const homes = edges(n, "cuisine").map(e => e.node);
    const ings = edges(n, "ingredient").map(e => e.node).sort(byName);
    const siblings = homes[0] ? edges(homes[0], "dish").map(e => e.node).filter(x => x !== n).sort(byName).slice(0, 40) : [];
    const cook = homes.flatMap(h => edges(h, "site")).slice(0, 4);
    page.innerHTML = `
      <p class="crumb"><a href="#/dishes">Dishes</a></p>
      <h1>${esc(d.name)}</h1>
      <p class="sub"><i style="background:${homes[0]?.color || NEUTRAL}"></i>${homes.length === 1 ? `Dish from ${esc(homes[0].name)}` : `Dish found in ${homes.length} cuisines`}</p>
      <div class="intro" id="intro"></div>
      ${own ? noteSource(own) : ""}
      <div class="actions">${globeBtn(n)}${!d.note || d.title ? outLink("https://en.wikipedia.org/wiki/" + encodeURIComponent((d.title || d.id).replace(/ /g, "_")), "Wikipedia") : ""}</div>
      ${section("Where it's from", linkList(homes))}
      ${section("Ingredients", linkList(ings), ings.length)}
      ${section("Cook it", cook.length ? siteRows(cook) : "")}
      ${section(homes[0] ? `More from ${esc(homes[0].name)}` : "", linkList(siblings))}
      ${section("Mentioned in", linkList(edges(n, "mentioned").map(e => e.node).sort(byName)))}
      ${correct(d.name)}`;
    fillIntro(own, d.note && !d.title ? null : (d.title || d.id));
  }

  function ingredientPage(n) {
    const i = n.i, own = notes.ingredients[i.id];
    const ds = edges(n, "dish").map(e => e.node);
    const byC = new Map();
    for (const d of ds) for (const e of edges(d, "cuisine")) { if (!byC.has(e.node)) byC.set(e.node, []); byC.get(e.node).push(d); }
    const rows = [...byC].sort((a, b) => b[1].length - a[1].length || byName(a[0], b[0]));
    const pairs = new Map();
    for (const d of ds) for (const e of edges(d, "ingredient")) if (e.node !== n) pairs.set(e.node, (pairs.get(e.node) || 0) + 1);
    const paired = [...pairs].sort((a, b) => b[1] - a[1]).slice(0, 16).map(([x]) => x);
    page.innerHTML = `
      <p class="crumb"><a href="#/ingredients">Ingredients</a></p>
      <h1>${esc(i.name)}</h1>
      <p class="sub"><i style="background:${n.color}"></i>Ingredient in ${ds.length} ${ds.length === 1 ? "dish" : "dishes"} across ${rows.length} ${rows.length === 1 ? "cuisine" : "cuisines"}</p>
      <div class="intro" id="intro"></div>
      ${own ? noteSource(own) : ""}
      <div class="actions">${ds.length ? globeBtn(n) : ""}${i.title ? outLink("https://en.wikipedia.org/wiki/" + encodeURIComponent(i.title.replace(/ /g, "_")), "Wikipedia") : ""}</div>
      ${section("Where it's cooked with", rows.length ? `<ul class="grouped">${rows.map(([c, list]) => `<li><b>${linkTo(c)}</b> <span class="n">${list.length}</span>${linkList(list.sort(byName))}</li>`).join("")}</ul>` : "", rows.length)}
      ${section("Often cooked with", linkList(paired))}
      ${section("Mentioned in", linkList(edges(n, "mentioned").map(e => e.node).sort(byName)))}
      ${correct(i.name)}`;
    fillIntro(own, i.title);
  }

  function sitePage(n) {
    const covers = edges(n, "cuisine").sort((a, b) => byName(a.node, b.node));
    const note = covers.map(e => e.entry.note).find(Boolean);
    page.innerHTML = `
      <p class="crumb"><a href="#/sites">Recipe sites</a></p>
      <h1>${esc(n.name)}</h1>
      <p class="sub"><i style="background:${n.color};border-radius:2px"></i>Recipe site, ${esc(n.host)}${covers.every(e => e.entry.suggested) ? `<span class="tag">Suggested</span>` : ""}</p>
      ${note ? `<div class="intro"><p>${esc(note)}</p></div>` : ""}
      <div class="actions">${outLink("https://" + n.host, "Visit " + n.host)}</div>
      ${section("Cuisines it covers", `<ul class="rows">${covers.map(e => `<li class="row"><span class="mark dot" style="background:${e.node.color}"></span><div>
        <a class="name" href="${e.node.href}">${esc(e.node.name)}</a><small>${esc(e.entry.name)}</small></div>
        <a class="out" href="${esc(e.entry.url)}" target="_blank" rel="noopener" aria-label="Open ${esc(e.entry.name)} for ${esc(e.node.name)}">${ARROW}</a></li>`).join("")}</ul>`, covers.length)}
      ${correct(n.name)}`;
  }

  function bookPage(n) {
    const covers = edges(n, "cuisine").sort((a, b) => byName(a.node, b.node));
    const b = { ...n.b, ...covers.map(e => e.entry).find(x => x.isbn || x.url) };
    const href = b.url || (b.isbn ? "https://openlibrary.org/isbn/" + b.isbn : null);
    page.innerHTML = `
      <p class="crumb"><a href="#/cookbooks">Cookbooks</a></p>
      <div class="cover">${b.isbn ? `<img alt="" src="https://covers.openlibrary.org/b/isbn/${esc(b.isbn)}-M.jpg?default=false" onerror="this.remove()">` : ""}<span>${esc(b.title)}</span></div>
      <h1>${esc(b.title)}</h1>
      <p class="sub"><i style="background:${n.color};border-radius:2px"></i>Cookbook${b.author ? " by " + esc(b.author) : ""}${b.year ? ", " + b.year : ""}${covers.every(e => e.entry.suggested) ? `<span class="tag">Suggested</span>` : ""}</p>
      ${b.note ? `<div class="intro"><p>${esc(b.note)}</p></div>` : ""}
      <div class="actions">${href ? outLink(href, b.url ? "Publisher or book page" : "Open Library") : ""}</div>
      ${section("Cuisines it covers", linkList(covers.map(e => e.node)), covers.length)}
      ${b.isbn ? `<p class="source" style="clear:both">ISBN ${esc(b.isbn)}</p>` : ""}
      ${correct(b.title)}`;
  }

  // Hub pages, like the index notes in a vault
  const stat = (t, label) => `<li><a href="#/${t === "book" ? "cookbooks" : t === "site" ? "sites" : PLURAL[t].toLowerCase()}"><b>${ofType(t).length.toLocaleString()}</b><span>${label}</span></a></li>`;
  function homePage() {
    const nationals = ofType("cuisine").filter(n => n.c.kind === "national");
    const indigenous = ofType("cuisine").filter(n => n.c.indigenous).sort(byName);
    const topIngs = ofType("ingredient").map(n => [n, edges(n, "dish").length]).sort((a, b) => b[1] - a[1]).slice(0, 40).map(([n]) => n);
    const shared = ofType("dish").filter(n => edges(n, "cuisine").length > 1).sort((a, b) => edges(b, "cuisine").length - edges(a, "cuisine").length).slice(0, 40);
    page.innerHTML = `
      <h1>The web of cuisines</h1>
      <div class="intro"><p>The same cuisines, dishes and ingredients as the globe, laid out as linked pages. Every page lists what it connects to, and the graph shows how it all ties together. Follow any link to keep going.</p></div>
      <ul class="stats">${stat("cuisine", "cuisines")}${stat("dish", "dishes")}${stat("ingredient", "ingredients")}${stat("site", "recipe sites")}${stat("book", "cookbooks")}</ul>
      ${section("Cuisines by region", byContinent(nationals))}
      ${section("Indigenous foodways", linkList(indigenous), indigenous.length)}
      ${section("Most-used ingredients", linkList(topIngs))}
      ${section("Dishes shared across borders", linkList(shared))}`;
  }
  function byContinent(list) {
    const groups = new Map();
    for (const n of list) { const k = (n.c.region || [])[0] || "Elsewhere"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(n); }
    return [...groups].sort((a, b) => (CONTINENT[a[0]] || a[0]).localeCompare(CONTINENT[b[0]] || b[0])).map(([k, l]) =>
      `<h3 id="${slug(CONTINENT[k] || k)}">${esc(CONTINENT[k] || k)}</h3>${linkList(l.sort(byName))}`).join("");
  }
  function indexPage(type, letter) {
    let list = ofType(type).sort(byName);
    if (type === "ingredient") list = list.filter(n => edges(n, "dish").length);
    const letters = [...new Set(list.map(n => norm(n.name).charAt(0).toUpperCase()).filter(ch => /[A-Z]/.test(ch)))].sort();
    const long = list.length > 300;
    const pick = long ? (letter || letters[0]) : null;
    const shown = long ? list.filter(n => norm(n.name).charAt(0).toUpperCase() === pick) : list;
    const base = `#/${type === "book" ? "cookbooks" : type === "site" ? "sites" : PLURAL[type].toLowerCase()}`;
    let body;
    if (type === "cuisine") {
      const beyond = list.filter(n => !n.c.iso3 || ["religious", "historical", "style"].includes(n.c.kind));
      body = byContinent(list.filter(n => !beyond.includes(n))) + `<h3 id="beyond-borders">Beyond borders</h3>${linkList(beyond)}`;
    } else body = linkList(shown);
    page.innerHTML = `
      <p class="crumb"><a href="#/">The web</a></p>
      <h1>${PLURAL[type]}</h1>
      <p class="sub">${list.length.toLocaleString()} in all${long ? `, ${shown.length} starting with ${pick}` : ""}</p>
      ${long ? `<nav class="letters" aria-label="By first letter">${letters.map(ch => `<a href="${base}/${ch}" aria-current="${ch === pick}">${ch}</a>`).join("")}</nav>` : ""}
      ${body}`;
  }

  // --- Routing ------------------------------------------------------------------
  const INDEX = { cuisines: "cuisine", dishes: "dish", ingredients: "ingredient", sites: "site", cookbooks: "book" };
  let current = null;
  function route() {
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    const [path, anchor] = h.split("#");
    const parts = path.split("/").filter(Boolean);
    current = null;
    if (!parts.length) homePage();
    else if (INDEX[parts[0]]) indexPage(INDEX[parts[0]], parts[1]);
    else {
      const n = bySlug.get(parts[0] + "/" + parts[1]);
      if (!n) { page.innerHTML = `<h1>Not found</h1><p class="empty">Nothing here by that name. <a href="#/">Back to the web</a>.</p>`; }
      else {
        current = n;
        ({ cuisine: cuisinePage, dish: dishPage, ingredient: ingredientPage, site: sitePage, book: bookPage })[n.type](n);
      }
    }
    document.title = (current ? current.name + " · " : "") + "Cuisine Explorer: the web";
    document.getElementById("to-globe").href = "./" + (current && globeHash(current) ? "#" + globeHash(current) : "");
    if (anchor) document.getElementById(anchor)?.scrollIntoView();
    else window.scrollTo(0, 0);
    drawLocal();
    if (fullOpen) highlight();
  }
  addEventListener("hashchange", route);

  // --- Graphs ---------------------------------------------------------------------
  // Shapes say what something is (color alone doesn't have to): circles for cuisines,
  // small dots for dishes, diamonds for ingredients, squares for sites, tall bars for books
  function shape(ctx, n, x, y, r) {
    ctx.beginPath();
    if (n.type === "ingredient") { ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); }
    else if (n.type === "site") ctx.rect(x - r * 0.85, y - r * 0.85, r * 1.7, r * 1.7);
    else if (n.type === "book") ctx.rect(x - r * 0.6, y - r, r * 1.2, r * 2);
    else ctx.arc(x, y, r, 0, 2 * Math.PI);
  }
  const keySvg = t => `<svg viewBox="-6 -6 12 12">${t === "ingredient" ? `<path d="M0-5 5 0 0 5-5 0z" fill="#c9b8dd"/>`
    : t === "site" ? `<rect x="-4" y="-4" width="8" height="8" fill="#55b8ad"/>` : t === "book" ? `<rect x="-3" y="-5" width="6" height="10" fill="#f0b340"/>`
    : t === "dish" ? `<circle r="3.5" fill="#ede6da"/>` : `<circle r="5" fill="#94bd5c"/>`}</svg>`;
  document.getElementById("key").innerHTML = ["cuisine", "dish", "ingredient", "site", "book"].map(t => `<span>${keySvg(t)}${TYPE_LABEL[t]}</span>`).join("");
  const size = n => n.type === "cuisine" ? (n.c.kind === "national" ? 5 : 3.6) : n.type === "dish" ? 2.2 : n.type === "ingredient" ? 2.8 : 3;
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tip = document.getElementById("tip");
  let mouse = [0, 0];
  addEventListener("pointermove", e => { mouse = [e.clientX, e.clientY]; if (tip.style.display === "block") placeTip(); });
  const placeTip = () => { tip.style.left = mouse[0] + 14 + "px"; tip.style.top = mouse[1] + 14 + "px"; };
  function hover(n) {
    if (!n) { tip.style.display = "none"; return; }
    tip.textContent = `${n.name} · ${TYPE_LABEL[n.type]}`;
    tip.style.display = "block"; placeTip();
  }

  // The local graph: this page and everything it links to, and how those connect
  const localEl = document.getElementById("local");
  let localGraph = null, localHover = null;
  function drawLocal() {
    const side = document.getElementById("side");
    side.hidden = !current;
    document.getElementById("layout").classList.toggle("solo", !current);
    if (!current) return;
    const priority = { cuisine: 0, site: 1, book: 1, ingredient: 2, dish: 3 };
    const near = [...current.out.values()].map(e => e.node).sort((a, b) => priority[a.type] - priority[b.type] || b.out.size - a.out.size).slice(0, 48);
    const set = new Set([current, ...near]);
    const gNodes = [...set].map(n => ({ n, id: n.key }));
    const gLinks = [];
    for (const a of set) for (const [k, e] of a.out) if (set.has(e.node) && a.key < k) gLinks.push({ source: a.key, target: k });
    if (!localGraph) {
      localGraph = ForceGraph()(localEl)
        .backgroundColor("rgba(0,0,0,0)")
        .nodeId("id")
        .linkColor(l => localHover && (l.source.n === localHover || l.target.n === localHover) ? "rgba(237,230,218,0.7)" : "rgba(169,159,181,0.28)")
        .linkWidth(1)
        .nodeCanvasObject((g, ctx, scale) => {
          const n = g.n, me = n === current, r = me ? 7 : size(n) + 1.5;
          shape(ctx, n, g.x, g.y, r);
          ctx.fillStyle = n.color; ctx.fill();
          if (me) { ctx.lineWidth = 2 / scale; ctx.strokeStyle = "#fff"; ctx.stroke(); }
          if (me || n === localHover || n.type !== "dish" || set.size < 18) {
            const fs = (me ? 12 : 10) / scale;
            ctx.font = `${me ? 700 : 400} ${fs}px Atkinson Hyperlegible Next, system-ui, sans-serif`;
            ctx.textAlign = "center"; ctx.textBaseline = "top";
            ctx.fillStyle = me || n === localHover ? "#ede6da" : "rgba(237,230,218,0.72)";
            ctx.fillText(n.name.length > 26 ? n.name.slice(0, 25) + "…" : n.name, g.x, g.y + r + 2 / scale);
          }
        })
        .nodePointerAreaPaint((g, color, ctx) => { ctx.fillStyle = color; shape(ctx, g.n, g.x, g.y, size(g.n) + 4); ctx.fill(); })
        .onNodeHover(g => { localHover = g ? g.n : null; localEl.style.cursor = g ? "pointer" : ""; hover(localHover); })
        .onNodeClick(g => { hover(null); location.hash = g.n.href; })
        .cooldownTicks(reduceMotion ? 0 : 120)
        .warmupTicks(reduceMotion ? 120 : 20)
        .d3VelocityDecay(0.35);
      localGraph.d3Force("charge").strength(-90);
      new ResizeObserver(() => localGraph.width(localEl.clientWidth).height(localEl.clientHeight)).observe(localEl);
      localGraph.onEngineStop(() => {
        localGraph.zoomToFit(0, 36);
        if (localGraph.zoom() > 2.6) localGraph.zoom(2.6, 0);
      });
    }
    const pinned = gNodes.find(g => g.n === current);
    pinned.fx = 0; pinned.fy = 0;
    localGraph.graphData({ nodes: gNodes, links: gLinks });
  }

  // The whole web
  const full = document.getElementById("full"), graphEl = document.getElementById("graph");
  let fullGraph = null, fullOpen = false, fullHover = null;
  const shown = { cuisine: true, dish: true, ingredient: true, site: true, book: true };
  let near = new Set();
  function highlight() { near = current ? new Set([current, ...[...current.out.values()].map(e => e.node)]) : new Set(); }
  function fullData() {
    const keep = nodeList.filter(n => shown[n.type]);
    const set = new Set(keep);
    const gl = [];
    for (const a of keep) for (const [k, e] of a.out) if (set.has(e.node) && a.key < k) gl.push({ source: a.key, target: k });
    return { nodes: keep.map(n => fullCache.get(n.key) || (fullCache.set(n.key, { n, id: n.key }), fullCache.get(n.key))), links: gl };
  }
  const fullCache = new Map();
  function openFull() {
    fullOpen = true; full.classList.add("open"); highlight();
    document.body.style.overflow = "hidden";
    if (!fullGraph) {
      fullGraph = ForceGraph()(graphEl)
        .backgroundColor("#1b1424")
        .width(innerWidth).height(innerHeight)
        .nodeId("id")
        .linkColor(l => near.has(l.source.n) && near.has(l.target.n) && (l.source.n === current || l.target.n === current) ? "rgba(237,230,218,0.75)" : "rgba(169,159,181,0.09)")
        .nodeCanvasObject((g, ctx, scale) => {
          const n = g.n, me = n === current, lit = !near.size || near.has(n);
          const r = me ? 8 : size(n);
          shape(ctx, n, g.x, g.y, r);
          ctx.globalAlpha = lit ? 1 : 0.28;
          ctx.fillStyle = n.color; ctx.fill();
          ctx.globalAlpha = 1;
          if (me) { ctx.lineWidth = 2.5 / scale; ctx.strokeStyle = "#fff"; ctx.stroke(); }
          const label = me || n === fullHover || (near.has(n) && scale > 0.9) || (n.type === "cuisine" && n.c.kind === "national" && scale > 1.6) || scale > 4.5;
          if (label) {
            const fs = Math.max(11 / scale, 1.2);
            ctx.font = `${me ? 700 : 400} ${fs}px Atkinson Hyperlegible Next, system-ui, sans-serif`;
            ctx.textAlign = "center"; ctx.textBaseline = "top";
            ctx.fillStyle = lit ? "#ede6da" : "rgba(237,230,218,0.5)";
            ctx.fillText(n.name, g.x, g.y + r + 1.5 / scale);
          }
        })
        .nodePointerAreaPaint((g, color, ctx) => { ctx.fillStyle = color; shape(ctx, g.n, g.x, g.y, size(g.n) + 2); ctx.fill(); })
        .onNodeHover(g => { fullHover = g ? g.n : null; graphEl.style.cursor = g ? "pointer" : ""; hover(fullHover); })
        .onNodeClick(g => { hover(null); closeFull(); location.hash = g.n.href; })
        .d3AlphaDecay(0.045)
        .d3VelocityDecay(0.4)
        .warmupTicks(reduceMotion ? 300 : 60)
        .cooldownTicks(reduceMotion ? 0 : 240);
      fullGraph.d3Force("charge").strength(-14).distanceMax(260);
      fullGraph.d3Force("link").distance(18);
      addEventListener("resize", () => fullOpen && fullGraph.width(innerWidth).height(innerHeight));
      fullGraph.graphData(fullData());
      fullGraph.onEngineStop(() => { if (fullOpen) focusCurrent(400); fullGraph.onEngineStop(() => {}); });
    }
    focusCurrent(0);
    document.getElementById("close-graph").focus();
  }
  function focusCurrent(ms) {
    const g = current && fullCache.get(current.key);
    if (g && g.x != null) { fullGraph.centerAt(g.x, g.y, reduceMotion ? 0 : ms); fullGraph.zoom(2.2, reduceMotion ? 0 : ms); }
    else fullGraph.zoomToFit(reduceMotion ? 0 : ms, 40);
  }
  function closeFull() {
    fullOpen = false; full.classList.remove("open"); document.body.style.overflow = ""; hover(null);
  }
  document.getElementById("open-graph").addEventListener("click", openFull);
  document.getElementById("open-graph-2").addEventListener("click", openFull);
  document.getElementById("close-graph").addEventListener("click", closeFull);
  addEventListener("keydown", e => { if (e.key === "Escape" && fullOpen) closeFull(); });
  const filters = document.getElementById("filters");
  filters.innerHTML = Object.keys(shown).map(t => `<button class="chip" type="button" data-t="${t}" aria-pressed="true">${keySvg(t)}${PLURAL[t]}</button>`).join(" ");
  filters.addEventListener("click", e => {
    const b = e.target.closest("[data-t]");
    if (!b) return;
    shown[b.dataset.t] = !shown[b.dataset.t];
    b.setAttribute("aria-pressed", String(shown[b.dataset.t]));
    fullGraph.graphData(fullData());
  });

  // --- Search ----------------------------------------------------------------------
  const q = document.getElementById("q"), results = document.getElementById("results");
  const index = nodeList.map(n => ({ n, s: norm(n.name), w: n.type === "cuisine" ? (n.c.kind === "national" ? 3 : 2) : n.type === "ingredient" ? 1.5 : 1 }));
  let hits = [], sel = 0;
  function search() {
    const t = norm(q.value.trim());
    if (!t) { results.classList.remove("open"); q.setAttribute("aria-expanded", "false"); return; }
    hits = index.filter(x => x.s.includes(t)).map(x => ({ ...x, score: (x.s.startsWith(t) ? 10 : 0) + (x.s === t ? 20 : 0) + x.w + x.n.out.size / 400 }))
      .sort((a, b) => b.score - a.score).slice(0, 24);
    const order = ["cuisine", "dish", "ingredient", "site", "book"];
    hits.sort((a, b) => order.indexOf(a.n.type) - order.indexOf(b.n.type) || b.score - a.score);
    sel = 0;
    let html = "", last = null;
    hits.forEach((x, i) => {
      if (x.n.type !== last) { html += `<li class="group" role="presentation">${PLURAL[x.n.type]}</li>`; last = x.n.type; }
      const sub = x.n.type === "cuisine" ? (x.n.c.iso3 ? isoName.get(x.n.c.iso3) || "" : "") : x.n.type === "site" ? x.n.host : `${x.n.out.size} links`;
      html += `<li role="option" id="r${i}" data-i="${i}" aria-selected="${i === 0}"><span>${esc(x.n.name)}</span><small>${esc(sub)}</small></li>`;
    });
    results.innerHTML = html || `<li class="group">Nothing matches</li>`;
    results.classList.add("open"); q.setAttribute("aria-expanded", "true");
  }
  const go = i => { const x = hits[i]; if (!x) return; q.value = ""; search(); q.blur(); if (fullOpen) closeFull(); location.hash = x.n.href; };
  q.addEventListener("input", search);
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault(); sel = Math.max(0, Math.min(hits.length - 1, sel + (e.key === "ArrowDown" ? 1 : -1)));
      results.querySelectorAll("[role=option]").forEach(li => li.setAttribute("aria-selected", String(+li.dataset.i === sel)));
      q.setAttribute("aria-activedescendant", "r" + sel);
    } else if (e.key === "Enter") go(sel);
    else if (e.key === "Escape") { q.value = ""; search(); }
  });
  results.addEventListener("click", e => { const li = e.target.closest("[data-i]"); if (li) go(+li.dataset.i); });
  document.addEventListener("click", e => { if (!e.target.closest(".search")) results.classList.remove("open"); });

  route();
})();
</script>
</body>
</html>
